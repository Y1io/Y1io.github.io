<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>佛宫寺释迦塔 · 山西应县木塔 3D 写实数字孪生</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: 'Noto Serif SC', 'Songti SC', serif;
    }

    canvas#webgl {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      outline: none;
      z-index: 1;
    }

    /* Classical Timber & Stone HUD Glassmorphism */
    .liao-panel {
      background: linear-gradient(135deg, rgba(24, 18, 15, 0.78) 0%, rgba(15, 14, 16, 0.68) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(196, 154, 108, 0.28);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255, 235, 200, 0.06);
    }

    .liao-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(196, 154, 108, 0.22);
      color: #e6dfd5;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .liao-btn:hover {
      background: rgba(196, 154, 108, 0.18);
      border-color: rgba(225, 180, 125, 0.6);
      color: #fff8eb;
      transform: translateY(-1px);
    }

    .liao-btn.active {
      background: linear-gradient(135deg, rgba(145, 48, 34, 0.65) 0%, rgba(168, 112, 56, 0.48) 100%);
      border-color: rgba(235, 188, 112, 0.85);
      color: #ffefd0;
      box-shadow: 0 0 16px rgba(185, 115, 55, 0.32);
    }

    .divider-line {
      width: 1px;
      height: 22px;
      background: linear-gradient(to bottom, transparent, rgba(196, 154, 108, 0.4), transparent);
    }

    .heritage-seal {
      background: #8b261d;
      border: 1px solid #d4a359;
      box-shadow: 0 0 10px rgba(139, 38, 29, 0.5);
    }


    #loader {
      position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at center, #1a130e 0%, #0b0e14 70%);
      color: #e8d7b5; letter-spacing: 0.35em; font-size: 14px;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
    #loader .bar { width: 180px; height: 2px; background: rgba(196,154,108,0.2); overflow: hidden; border-radius: 2px; }
    #loader .bar i { display: block; height: 100%; width: 40%; background: #d4a359; animation: ld 1.1s ease-in-out infinite; }
    @keyframes ld { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    #fps-badge {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.04em;
      color: #cfe8c8; padding: 6px 9px; border-radius: 10px; line-height: 1.25; text-align: right;
      min-width: 74px;
    }
    #fps-badge.hide { display: none; }

    #crosshair {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border: 1.5px solid rgba(255, 230, 180, 0.85);
      border-radius: 50%;
      pointer-events: none;
      z-index: 40;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="relative text-stone-100 overflow-hidden select-none">

  <div id="loader"><div>佛 宫 寺 释 迦 塔</div><div class="bar"><i></i></div><div id="loader-msg" style="font-size:11px;opacity:.6;letter-spacing:.2em">正在营造…</div></div>

  <!-- 3D WebGL Canvas -->
  <canvas id="webgl"></canvas>

  <!-- First Person Crosshair -->

  <!-- Top Left: Heritage Title Plaque -->

    <div class="liao-panel rounded-2xl px-4 py-3 pointer-events-auto flex items-center space-x-3.5">
      <div class="heritage-seal w-7 h-11 rounded flex flex-col items-center justify-center text-[11px] font-bold tracking-tighter leading-tight text-amber-100">

      </div>
      <div>

        </div>
        <p class="text-[11px] text-stone-300/75 tracking-widest mt-0.5">纯木结构 · 五层六檐 · 五十四种斗拱 · 历代名匾</p>
      </div>

  <!-- Top Right: Audio & Atmosphere Toggle -->

    <div id="fps-badge" class="liao-panel hide"><span id="fps-val">-- FPS</span><br /><span id="fps-sub" style="opacity:.6">-</span></div>
    <button id="btn-quality" class="liao-panel liao-btn rounded-xl px-3.5 py-2.5 flex items-center space-x-2 text-xs tracking-wider" title="画质：自动(动态分辨率) / 高 / 中 / 低；按 F 显示帧率">

    <button id="btn-sound" class="liao-panel liao-btn rounded-xl px-3.5 py-2.5 flex items-center space-x-2 text-xs tracking-wider" title="开关古寺铁马风铎与古琴声景">

  <!-- Bottom Control Dock -->
  <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-20 w-[96%] max-w-5xl">
    <div class="liao-panel rounded-2xl p-2 sm:px-4 sm:py-2.5 flex flex-wrap items-center justify-between gap-2">

      <!-- Day / Night Switch -->

      <div class="divider-line hidden sm:block"></div>

      <!-- Fog / Clear Switch -->

      <div class="flex items-center space-x-1.5">

        <button id="btn-fpv" class="liao-btn rounded-xl px-3 py-1.5 text-xs flex items-center space-x-1.5 tracking-widest">

          <span>第一人称漫步</span>
        </button>
      </div>

      <div class="divider-line hidden md:block"></div>

      <!-- Preset Camera Views -->
      <div class="hidden md:flex items-center space-x-1.5">
        <button id="cam-photo" class="liao-btn active rounded-lg px-2.5 py-1.5 text-[11px] tracking-wider" title="复刻参考照片正视仰拍机位">
          实景正视
        </button>
        <button id="cam-plaque" class="liao-btn rounded-lg px-2.5 py-1.5 text-[11px] tracking-wider" title="近观斗拱与释迦塔名匾">
          斗拱名匾
        </button>
        <button id="cam-corridor" class="liao-btn rounded-lg px-2.5 py-1.5 text-[11px] tracking-wider" title="副阶回廊与万古观瞻">
          副阶山门
        </button>
        <button id="cam-aerial" class="liao-btn rounded-lg px-2.5 py-1.5 text-[11px] tracking-wider" title="全塔八角与铁刹全景">
          铁刹全景
        </button>

    </div>

    <!-- First-Person Walkthrough Instruction Banner -->
    <div id="fpv-hint" class="hidden text-center text-xs text-amber-100/90 mt-2 tracking-widest liao-panel rounded-xl py-1.5 px-4">
      【第一人称漫游】按 <span class="text-amber-300 font-semibold">W A S D</span> 或方向键在古寺甬道、双层青石须弥座及副阶回廊间行走，点击画面移动鼠标环视，按住 <span class="text-amber-300 font-semibold">Shift</span> 小跑，<span class="text-amber-300 font-semibold">ESC</span> 退出鼠标锁定。
    </div>
  </div>

  <script>
    if (window.lucide) { try { lucide.createIcons(); } catch (e) {} }
    /* ==========================================================================
       1. PROCEDURAL TEMPLE WINDBELL & GUQIN AUDIO ENGINE (铁马风铎与古琴)
       ========================================================================== */
    class TempleAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.masterGain = null;
        this.timer = null;
        this.notes = [146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00];
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.0, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);

        this.setupWindNoise();
        this.startLoop();
      }

      setupWindNoise() {
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          data[i] = (b0 + b1 + b2) * 0.06;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(320, this.ctx.currentTime);
        filter.Q.setValueAtTime(1.5, this.ctx.currentTime);

        const wGain = this.ctx.createGain();
        wGain.gain.setValueAtTime(0.25, this.ctx.currentTime);

        noise.connect(filter);
        filter.connect(wGain);
        wGain.connect(this.masterGain);
        noise.start();
      }

      playIronWindbell() {
        if (!this.ctx || !this.isPlaying) return;
        const now = this.ctx.currentTime;
        const base = 987.77 + (Math.random() > 0.5 ? 187 : 0);
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(base, now);
        osc2.frequency.setValueAtTime(base * 2.41, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.055, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.masterGain);
        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 2.7);
        osc2.stop(now + 2.7);
      }

      playPluck() {
        if (!this.ctx || !this.isPlaying) return;
        const now = this.ctx.currentTime;
        const freq = this.notes[Math.floor(Math.random() * this.notes.length)];
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 3.5, now);
        filter.frequency.exponentialRampToValueAtTime(freq * 1.1, now + 3.2);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0005, now + 3.8);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 3.9);
      }

      startLoop() {
        const tick = () => {
          this.timer = setTimeout(() => {
            if (this.isPlaying) {
              if (Math.random() > 0.35) this.playIronWindbell();
              if (Math.random() > 0.45) setTimeout(() => this.playPluck(), 500);
            }
            tick();
          }, 1800 + Math.random() * 2400);
        };
        tick();
      }

      toggle() {
        if (!this.ctx) this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = !this.isPlaying;
        this.masterGain.gain.setTargetAtTime(this.isPlaying ? 0.45 : 0.0, this.ctx.currentTime, 0.3);
        if (this.isPlaying) this.playIronWindbell();
        return this.isPlaying;
      }
    }

    const audioEngine = new TempleAudioEngine();

    function boot() {

    /* ==========================================================================
       2. RENDERER / SCENE / CAMERA  (确定性随机 · 静态阴影 · 动态分辨率)
       ========================================================================== */
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261105);           // 布局 / 贴图 / 树木全部用同一随机序列，保证每次打开一致
    const lerp = THREE.MathUtils.lerp;
    const clamp = THREE.MathUtils.clamp;
    function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
    function vnoise(x, y) {                       // 值噪声，用于顶点色 / 地形
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
    }

    const canvas = document.getElementById('webgl');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.3, 1200);
    camera.position.set(0, 9, 88);

    const deviceDPR = window.devicePixelRatio || 1;
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: deviceDPR < 2,                   // 高分屏本身足够细腻，关闭 MSAA 省下大量填充率
      powerPreference: 'high-performance',
      stencil: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(deviceDPR, 1.75));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false;        // 场景静态：阴影只烘一次，每帧省掉整套 shadow pass
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

    const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.06;
    orbitControls.maxPolarAngle = Math.PI / 2 - 0.02;
    orbitControls.minDistance = 8;
    orbitControls.maxDistance = 190;
    orbitControls.target.set(0, 30, 0);

    const fogDayColor = new THREE.Color(0x9dbbe0);
    const fogNightColor = new THREE.Color(0x070b16);
    scene.fog = new THREE.FogExp2(fogDayColor, 0.0007);

    /* ==========================================================================
       3. PBR 程序化贴图（瓦、木、石、墙、窗、地面、匾额）
       ========================================================================== */
    function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
    function finishTex(c, { repeat = true, aniso = 4, srgb = false } = {}) {
      const t = new THREE.CanvasTexture(c);
      if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = Math.min(aniso, maxAniso);
      return t;
    }

    // 3.1 灰陶筒瓦 + 板瓦（瓦垄 16 条 / 叠压 16 行，贴图覆盖 5.44m × 5.44m）
    function createTileTextures() {
      const W = 512, ribs = 16, rows = 16, rw = W / ribs, rh = W / rows;
      const cc = mkCanvas(W, W), cb = mkCanvas(W, W);
      const a = cc.getContext('2d'), b = cb.getContext('2d');
      a.fillStyle = '#5d5b55'; a.fillRect(0, 0, W, W);
      b.fillStyle = '#707070'; b.fillRect(0, 0, W, W);
      for (let i = 0; i < ribs; i++) {
        const x = i * rw;
        // 板瓦（凹）
        let g = a.createLinearGradient(x, 0, x + rw, 0);
        g.addColorStop(0, '#47453f'); g.addColorStop(0.5, '#6b685f'); g.addColorStop(1, '#47453f');
        a.fillStyle = g; a.fillRect(x, 0, rw, W);
        // 筒瓦（凸，居中偏窄）
        g = a.createLinearGradient(x + rw * 0.28, 0, x + rw * 0.72, 0);
        g.addColorStop(0, '#4c4a44'); g.addColorStop(0.5, '#948f82'); g.addColorStop(1, '#4c4a44');
        a.fillStyle = g; a.fillRect(x + rw * 0.28, 0, rw * 0.44, W);
        g = b.createLinearGradient(x + rw * 0.28, 0, x + rw * 0.72, 0);
        g.addColorStop(0, '#303030'); g.addColorStop(0.5, '#f4f4f4'); g.addColorStop(1, '#303030');
        b.fillStyle = g; b.fillRect(x + rw * 0.28, 0, rw * 0.44, W);
        b.fillStyle = '#1e1e1e'; b.fillRect(x, 0, rw * 0.12, W); b.fillRect(x + rw * 0.88, 0, rw * 0.12, W);
      }
      for (let j = 0; j < rows; j++) {                      // 叠压阴影
        const y = j * rh;
        const g = a.createLinearGradient(0, y, 0, y + rh * 0.5);
        g.addColorStop(0, 'rgba(18,16,12,0.55)'); g.addColorStop(1, 'rgba(18,16,12,0)');
        a.fillStyle = g; a.fillRect(0, y, W, rh * 0.5);
        b.fillStyle = 'rgba(0,0,0,0.45)'; b.fillRect(0, y, W, 3);
      }
      for (let k = 0; k < 520; k++) {                       // 逐片瓦色差
        const x = Math.floor(rand() * ribs) * rw, y = Math.floor(rand() * rows) * rh;
        a.fillStyle = rand() > 0.5 ? 'rgba(210,200,170,0.07)' : 'rgba(10,10,8,0.10)';
        a.fillRect(x + 2, y + 2, rw - 4, rh - 4);
      }
      for (let k = 0; k < 140; k++) {                       // 青苔 / 瓦松
        a.fillStyle = `rgba(${70 + rand() * 30 | 0},${88 + rand() * 30 | 0},${40 + rand() * 20 | 0},${0.05 + rand() * 0.1})`;
        a.beginPath(); a.arc(rand() * W, rand() * W, 3 + rand() * 12, 0, 6.283); a.fill();
      }
      return { map: finishTex(cc, { aniso: 8 }), bump: finishTex(cb, { aniso: 4 }) };
    }

    // 3.2 千年风化红松木（贴图覆盖 2m × 2m，竖向木纹；横梁在 UV 里已转置）
    function createTimberTexture() {
      const W = 512, c = mkCanvas(W, W), x = c.getContext('2d');
      x.fillStyle = '#7b3524'; x.fillRect(0, 0, W, W);
      for (let i = 0; i < 520; i++) {                        // 纤维
        x.fillStyle = i % 3 === 0 ? '#3a150c' : (i % 3 === 1 ? '#a24c33' : '#5a2216');
        x.globalAlpha = 0.07 + rand() * 0.16;
        x.fillRect(rand() * W, rand() * W, 1 + rand() * 2.5, 50 + rand() * 230);
      }
      x.globalAlpha = 1;
      for (let i = 0; i < 46; i++) {                         // 干裂
        const px = rand() * W, py = rand() * W, len = 30 + rand() * 120;
        x.strokeStyle = 'rgba(25,8,4,0.55)'; x.lineWidth = 1 + rand() * 1.4;
        x.beginPath(); x.moveTo(px, py);
        x.bezierCurveTo(px + rand() * 4 - 2, py + len * 0.3, px + rand() * 6 - 3, py + len * 0.6, px + rand() * 4 - 2, py + len);
        x.stroke();
      }
      for (let i = 0; i < 10; i++) {                         // 木节
        const px = rand() * W, py = rand() * W;
        const g = x.createRadialGradient(px, py, 1, px, py, 9 + rand() * 8);
        g.addColorStop(0, 'rgba(30,10,5,0.75)'); g.addColorStop(1, 'rgba(30,10,5,0)');
        x.fillStyle = g; x.beginPath(); x.ellipse(px, py, 8, 16, 0, 0, 6.283); x.fill();
      }
      x.globalAlpha = 0.07; x.fillStyle = '#c4a785';         // 积尘与雨痕
      for (let i = 0; i < 120; i++) x.fillRect(rand() * W, rand() * W, 6 + rand() * 24, 2 + rand() * 9);
      x.globalAlpha = 1;
      return finishTex(c, { aniso: 8 });
    }

    // 3.3 椽飞底面（径向条纹，贴图覆盖 1.6m）
    function createRafterTexture() {
      const c = mkCanvas(256, 256), x = c.getContext('2d');
      x.fillStyle = '#3c1a10'; x.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 8; i++) {
        const px = i * 32;
        const g = x.createLinearGradient(px, 0, px + 32, 0);
        g.addColorStop(0, '#2a110a'); g.addColorStop(0.5, '#5d2a1b'); g.addColorStop(1, '#2a110a');
        x.fillStyle = g; x.fillRect(px + 2, 0, 28, 256);
      }
      for (let i = 0; i < 160; i++) { x.fillStyle = `rgba(0,0,0,${0.05 + rand() * 0.1})`; x.fillRect(rand() * 256, rand() * 256, 1.5, 20 + rand() * 60); }
      return finishTex(c, { aniso: 4 });
    }

    // 3.4 青白条石（贴图覆盖 3m × 3m，条石 0.5 × 0.3m）
    function createStoneTexture(kind) {
      const W = 512, c = mkCanvas(W, W), x = c.getContext('2d'), cb = mkCanvas(W, W), b = cb.getContext('2d');
      const rows = kind === 'pave' ? 8 : 10, cols = kind === 'pave' ? 4 : 6;
      const rh = W / rows, cw = W / cols;
      x.fillStyle = '#4a443c'; x.fillRect(0, 0, W, W);
      b.fillStyle = '#202020'; b.fillRect(0, 0, W, W);
      for (let r = 0; r < rows; r++) {
        const off = (r % 2) * cw * 0.5;
        for (let q = -1; q <= cols; q++) {
          const bx = q * cw + off, by = r * rh, sh = (rand() - 0.5) * 30;
          const base = kind === 'pave' ? [150, 138, 120] : [172, 166, 152];
          const col = base.map((v, i) => Math.max(0, Math.min(255, v + sh + (i === 2 ? -4 : 0))) | 0);
          x.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
          x.fillRect(bx + 2.5, by + 2.5, cw - 5, rh - 5);
          b.fillStyle = `rgb(${150 + (rand() * 50 | 0)},${150},${150})`; b.fillRect(bx + 3, by + 3, cw - 6, rh - 6);
        }
      }
      for (let i = 0; i < 1500; i++) {                       // 砂粒 / 风化坑
        x.fillStyle = rand() > 0.5 ? 'rgba(255,250,235,0.08)' : 'rgba(30,26,20,0.12)';
        x.fillRect(rand() * W, rand() * W, 2 + rand() * 3, 2 + rand() * 3);
      }
      for (let i = 0; i < 60; i++) {                         // 苔痕（偏下沿）
        x.fillStyle = `rgba(70,90,50,${0.05 + rand() * 0.08})`;
        x.beginPath(); x.ellipse(rand() * W, rand() * W, 6 + rand() * 18, 3 + rand() * 6, 0, 0, 6.283); x.fill();
      }
      return { map: finishTex(c, { aniso: 8 }), bump: finishTex(cb, { aniso: 4 }) };
    }

    // 3.5 红土抹灰墙（斑驳脱落）
    function createPlasterTexture() {
      const c = mkCanvas(256, 256), x = c.getContext('2d');
      x.fillStyle = '#8a3426'; x.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 900; i++) {
        x.fillStyle = rand() > 0.5 ? 'rgba(255,200,160,0.05)' : 'rgba(40,10,6,0.07)';
        x.beginPath(); x.arc(rand() * 256, rand() * 256, 2 + rand() * 9, 0, 6.283); x.fill();
      }
      for (let i = 0; i < 26; i++) {                         // 剥落露出泥底
        x.fillStyle = `rgba(150,112,82,${0.14 + rand() * 0.18})`;
        x.beginPath(); x.ellipse(rand() * 256, rand() * 256, 4 + rand() * 12, 2 + rand() * 6, rand() * 3, 0, 6.283); x.fill();
      }
      for (let i = 0; i < 40; i++) {                         // 雨水冲刷竖痕
        x.fillStyle = 'rgba(20,8,4,0.10)'; x.fillRect(rand() * 256, rand() * 120, 1 + rand() * 2, 40 + rand() * 120);
      }
      return finishTex(c, { aniso: 4 });
    }

    // 3.6 格扇窗：颜色图（白天暗）+ 自发光图（夜晚只有窗纸发暖光，木棂保持深色）
    function createLatticeTextures() {
      const W = 256, c = mkCanvas(W, W), x = c.getContext('2d'), e = mkCanvas(W, W), y = e.getContext('2d');
      x.fillStyle = '#35271b'; x.fillRect(0, 0, W, W);           // 窗纸（白天偏暗，室内无光）
      y.fillStyle = '#ffb25a'; y.fillRect(0, 0, W, W);
      const g = y.createRadialGradient(W / 2, W / 2, 10, W / 2, W / 2, W * 0.75);
      g.addColorStop(0, 'rgba(255,230,160,0.9)'); g.addColorStop(1, 'rgba(255,120,40,0)');
      y.fillStyle = g; y.fillRect(0, 0, W, W);
      const bar = (fn) => { fn(x, '#6b2d1d'); fn(y, '#000'); };
      bar((ctx, col) => {
        ctx.strokeStyle = col;
        ctx.lineWidth = 12; ctx.strokeRect(6, 6, W - 12, W - 12);
        ctx.lineWidth = 6;
        for (let i = 1; i < 5; i++) {                              // 灯笼锦式方格 + 斜枝
          const p = (W / 5) * i;
          ctx.beginPath(); ctx.moveTo(p, 6); ctx.lineTo(p, W - 6); ctx.moveTo(6, p); ctx.lineTo(W - 6, p); ctx.stroke();
        }
        ctx.lineWidth = 3;
        for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
          const cx = (W / 5) * (i + 0.5), cy = (W / 5) * (j + 0.5), r = 11;
          ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.closePath(); ctx.stroke();
        }
      });
      return { map: finishTex(c, { repeat: false, aniso: 4 }), emissive: finishTex(e, { repeat: false, aniso: 2 }) };
    }

    // 3.7 庭院地面（夯土 + 草斑，大尺度，覆盖 24m）
    function createGroundTexture() {
      const W = 1024, c = mkCanvas(W, W), x = c.getContext('2d');
      x.fillStyle = '#8c7d63'; x.fillRect(0, 0, W, W);
      const blob = (n, rgba, rMin, rMax) => {
        for (let i = 0; i < n; i++) {
          const px = rand() * W, py = rand() * W, r = rMin + rand() * (rMax - rMin);
          x.fillStyle = typeof rgba === 'function' ? rgba() : rgba;
          for (const ox of [-W, 0, W]) for (const oy of [-W, 0, W]) {
            if (px + ox + r < 0 || px + ox - r > W || py + oy + r < 0 || py + oy - r > W) continue;
            x.beginPath(); x.arc(px + ox, py + oy, r, 0, 6.283); x.fill();
          }
        }
      };
      blob(260, () => `rgba(${96 + rand() * 30 | 0},${112 + rand() * 30 | 0},${58 + rand() * 18 | 0},${0.07 + rand() * 0.1})`, 18, 90);   // 草斑
      blob(300, () => `rgba(${170 + rand() * 30 | 0},${150 + rand() * 25 | 0},${112 + rand() * 20 | 0},0.08)`, 10, 60);                      // 浮土
      blob(500, 'rgba(60,48,34,0.06)', 3, 16);                                                                                          // 碎石
      for (let i = 0; i < 2600; i++) { x.fillStyle = rand() > 0.5 ? 'rgba(255,245,220,0.07)' : 'rgba(30,22,14,0.1)'; x.fillRect(rand() * W, rand() * W, 2, 2); }
      return finishTex(c, { aniso: 8 });
    }

    // 3.8 云层噪声（天空穹顶采样，无缝）
    function createCloudTexture() {
      const W = 256, c = mkCanvas(W, W), x = c.getContext('2d');
      x.fillStyle = '#000'; x.fillRect(0, 0, W, W);
      for (let i = 0; i < 90; i++) {
        const px = rand() * W, py = rand() * W, r = 12 + rand() * 38;
        for (const ox of [-W, 0, W]) for (const oy of [-W, 0, W]) {
          const g = x.createRadialGradient(px + ox, py + oy, 0, px + ox, py + oy, r);
          g.addColorStop(0, 'rgba(255,255,255,0.20)'); g.addColorStop(1, 'rgba(255,255,255,0)');
          x.fillStyle = g; x.beginPath(); x.arc(px + ox, py + oy, r, 0, 6.283); x.fill();
        }
      }
      return finishTex(c, { aniso: 1 });
    }

    // 3.9 匾额（先立即绘制，字体就绪后重绘，避免首次渲染成宋体回退字）
    const plaqueTextures = [];
    function paintPlaque(c, { text, isVertical, bgStyle, borderColor }) {
      const ctx = c.getContext('2d');
      if (bgStyle === 'white') {
        const g = ctx.createRadialGradient(c.width / 2, c.height / 2, 10, c.width / 2, c.height / 2, c.width * 0.7);
        g.addColorStop(0, '#e2ded3'); g.addColorStop(1, '#b6b0a1'); ctx.fillStyle = g;
      } else ctx.fillStyle = bgStyle === 'royalBlue' ? '#142952' : (bgStyle === 'darkGold' ? '#332218' : '#5a2d1c');
      ctx.fillRect(0, 0, c.width, c.height);
      for (let i = 0; i < 140; i++) { ctx.fillStyle = 'rgba(60,50,40,0.05)'; ctx.beginPath(); ctx.arc(rand() * c.width, rand() * c.height, 4 + rand() * 18, 0, 6.283); ctx.fill(); }
      ctx.strokeStyle = borderColor; ctx.lineWidth = 18; ctx.strokeRect(9, 9, c.width - 18, c.height - 18);
      ctx.strokeStyle = bgStyle === 'royalBlue' ? '#d4a846' : '#8c6d46'; ctx.lineWidth = 4; ctx.strokeRect(22, 22, c.width - 44, c.height - 44);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = (bgStyle === 'royalBlue' || bgStyle === 'darkGold') ? '#dab052' : '#1c1917';
      const chars = text.split('');
      const face = '"Noto Serif SC","Songti SC","SimSun","STSong",serif';
      if (isVertical) {
        const fs = Math.floor((c.height - 90) / chars.length * 0.82);
        ctx.font = `900 ${fs}px ${face}`;
        chars.forEach((ch, i) => ctx.fillText(ch, c.width / 2, 65 + i * ((c.height - 130) / Math.max(1, chars.length - 1))));
      } else {
        const fs = Math.floor((c.width - 80) / chars.length * 0.78);
        ctx.font = `900 ${fs}px ${face}`;
        const tw = c.width - 110;
        chars.forEach((ch, i) => ctx.fillText(ch, chars.length === 1 ? c.width / 2 : 55 + i * (tw / (chars.length - 1)), c.height / 2 + 4));
      }
    }
    function createPlaqueMaterial(opts) {
      const c = mkCanvas(opts.isVertical ? 256 : 512, opts.isVertical ? 512 : 256);
      paintPlaque(c, opts);
      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = maxAniso;
      plaqueTextures.push({ c, tex, opts });
      return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55, metalness: 0.06 });
    }
    function repaintPlaquesWhenFontReady() {
      if (!document.fonts || !document.fonts.load) return;
      const all = plaqueTextures.map((p) => p.opts.text).join('');
      document.fonts.load('900 64px "Noto Serif SC"', all).then(() => {
        plaqueTextures.forEach((p) => { paintPlaque(p.c, p.opts); p.tex.needsUpdate = true; });
      }).catch(() => {});
    }

    /* ---- 材质（每类材质只有一份，静态几何按材质合批） ---- */
    const tileTex = createTileTextures();
    const timberTex = createTimberTexture();
    const stoneTex = createStoneTexture('block');
    const paveTex = createStoneTexture('pave');
    const latticeTex = createLatticeTextures();

    const MAT = {
      tile: new THREE.MeshStandardMaterial({ map: tileTex.map, bumpMap: tileTex.bump, bumpScale: 0.16, roughness: 0.84, metalness: 0.03, vertexColors: true }),
      timber: new THREE.MeshStandardMaterial({ map: timberTex, bumpMap: timberTex, bumpScale: 0.06, roughness: 0.8, metalness: 0.03, vertexColors: true }),
      rafter: new THREE.MeshStandardMaterial({ map: createRafterTexture(), roughness: 0.9, vertexColors: true }),   // 椽底贴图在下方设 repeat
      stone: new THREE.MeshStandardMaterial({ map: stoneTex.map, bumpMap: stoneTex.bump, bumpScale: 0.07, roughness: 0.9, metalness: 0.01, vertexColors: true }),
      pave: new THREE.MeshStandardMaterial({ map: paveTex.map, bumpMap: paveTex.bump, bumpScale: 0.06, roughness: 0.88, vertexColors: true }),
      plaster: new THREE.MeshStandardMaterial({ map: createPlasterTexture(), roughness: 0.93, vertexColors: true }),
      window: new THREE.MeshStandardMaterial({ map: latticeTex.map, emissive: 0xffffff, emissiveMap: latticeTex.emissive, emissiveIntensity: 0.0, roughness: 0.7, vertexColors: true }),
      iron: new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.45, vertexColors: true }),
      bronze: new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.4, vertexColors: true }),
      dark: new THREE.MeshBasicMaterial({ vertexColors: true }),                  // 门洞暗部（不受光）
      lantern: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffa24a, emissiveIntensity: 0.0, roughness: 0.6, vertexColors: true }),
      flower: new THREE.MeshStandardMaterial({ roughness: 0.6, vertexColors: true }),
      bark: new THREE.MeshStandardMaterial({ roughness: 0.95, vertexColors: true })
    };
    MAT.rafter.map.repeat.set(5, 2);
    const groundTex = createGroundTexture();
    groundTex.repeat.set(14, 14);
    const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.96, metalness: 0 });

    // 风吹树叶 / 草（顶点权重 aWeight、相位 aPhase 由合批器写入）
    const windUniform = { value: 0 };
    function windHook(shader) {
      shader.uniforms.uTime = windUniform;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nuniform float uTime;\nattribute float aWeight;\nattribute float aPhase;')
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          transformed.x += sin(uTime * 1.25 + aPhase + position.y * 0.3) * aWeight * 0.17;
          transformed.z += cos(uTime * 1.02 + aPhase * 1.7 + position.x * 0.2) * aWeight * 0.12;`);
    }
    MAT.leaf = new THREE.MeshStandardMaterial({ roughness: 0.82, vertexColors: true, side: THREE.DoubleSide });
    MAT.leaf.onBeforeCompile = windHook;
    MAT.grass = new THREE.MeshStandardMaterial({ roughness: 0.9, vertexColors: true, side: THREE.DoubleSide });
    MAT.grass.onBeforeCompile = windHook;

    /* ==========================================================================
       4. 天空穹顶（晴空 · 流云 · 日晕 · 星夜）+ 远山
       ========================================================================== */
    const SUN_DIR = new THREE.Vector3(38, 68, 52).normalize();
    const cloudTex = createCloudTexture();
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        uNightMix: { value: 0.0 },
        uTime: { value: 0.0 },
        uCloud: { value: cloudTex },
        uSun: { value: SUN_DIR.clone() }
      },
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vDir = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vDir;
        uniform float uNightMix;
        uniform float uTime;
        uniform sampler2D uCloud;
        uniform vec3 uSun;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
        void main() {
          vec3 dir = normalize(vDir);
          float h = clamp(dir.y, 0.0, 1.0);
          vec3 dayZenith = vec3(0.24, 0.45, 0.78);
          vec3 dayMid = vec3(0.45, 0.67, 0.92);
          vec3 dayHorizon = vec3(0.74, 0.85, 0.96);
          vec3 dayCol = mix(dayHorizon, dayMid, smoothstep(0.0, 0.26, h));
          dayCol = mix(dayCol, dayZenith, smoothstep(0.26, 0.85, h));

          float sd = max(dot(dir, uSun), 0.0);
          dayCol += vec3(1.0, 0.93, 0.78) * (pow(sd, 6.0) * 0.18 + pow(sd, 220.0) * 0.9);

          // 流云：贴图采样（两层漂移），只在地平线以上
          vec2 cuv = dir.xz / (dir.y + 0.28);
          float c1 = texture2D(uCloud, cuv * 0.16 + vec2(uTime * 0.004, 0.0)).r;
          float c2 = texture2D(uCloud, cuv * 0.37 + vec2(0.0, uTime * 0.006) + 0.31).r;
          float cl = smoothstep(0.30, 0.95, c1 * 0.75 + c2 * 0.5) * smoothstep(0.02, 0.22, dir.y);
          vec3 cloudCol = mix(vec3(1.0), vec3(0.78, 0.82, 0.9), c2 * 0.6);
          dayCol = mix(dayCol, cloudCol, cl * 0.72);

          vec3 nightZenith = vec3(0.01, 0.02, 0.05);
          vec3 nightMid = vec3(0.03, 0.06, 0.14);
          vec3 nightHorizon = vec3(0.08, 0.11, 0.20);
          vec3 nightCol = mix(nightHorizon, nightMid, smoothstep(0.0, 0.26, h));
          nightCol = mix(nightCol, nightZenith, smoothstep(0.26, 0.85, h));
          if (uNightMix > 0.05 && h > 0.08) {
            vec2 starUV = floor(dir.xz / (dir.y + 0.1) * 190.0);
            float s = hash(starUV);
            if (s > 0.9945) {
              float tw = 0.5 + 0.5 * sin(uTime * 2.8 + s * 100.0);
              nightCol += vec3(0.95, 0.92, 0.82) * tw * uNightMix;
            }
            nightCol += vec3(0.5, 0.58, 0.8) * (pow(sd, 400.0) * 0.8 + cl * 0.03);      // 月晕 + 夜云微光
          }
          gl_FragColor = vec4(mix(dayCol, nightCol, uNightMix), 1.0);
        }
      `
    });
    const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 20), skyMat);
    skyMesh.renderOrder = -10;
    skyMesh.frustumCulled = false;
    scene.add(skyMesh);

    // 远山：一圈低矮山脊剪影，吃雾，给纵深
    const hillsMat = new THREE.MeshBasicMaterial({ color: 0x8aa0b4, fog: true, side: THREE.DoubleSide });
    (function buildHills() {
      const seg = 160, R = 560;
      const g = new THREE.BufferGeometry();
      const pos = [], idx = [];
      for (let i = 0; i <= seg; i++) {
        const a = (i / seg) * Math.PI * 2;
        const n = vnoise(i * 0.16, 3.1) * 0.7 + vnoise(i * 0.55, 9.7) * 0.3;
        const h = 26 + n * 62;
        pos.push(Math.sin(a) * R, -4, Math.cos(a) * R, Math.sin(a) * R, h, Math.cos(a) * R);
        if (i < seg) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
      }
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      const m = new THREE.Mesh(g, hillsMat);
      m.frustumCulled = false;
      scene.add(m);
    })();
    const hillsDay = new THREE.Color(0x8aa0b4), hillsNight = new THREE.Color(0x0b1220);

    /* ==========================================================================
       5. 光照（日光静态阴影 · 夜间仅 2 盏点光，避免逐像素光照爆炸）
       ========================================================================== */
    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x8c7a65, 0.74);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e4, 2.35);
    sunLight.position.copy(SUN_DIR).multiplyScalar(170);
    sunLight.target.position.set(0, 12, 8);
    scene.add(sunLight.target);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 20;
    sunLight.shadow.camera.far = 360;
    sunLight.shadow.camera.left = -78;
    sunLight.shadow.camera.right = 78;
    sunLight.shadow.camera.top = 78;
    sunLight.shadow.camera.bottom = -78;
    sunLight.shadow.bias = -0.0003;
    sunLight.shadow.normalBias = 0.05;
    scene.add(sunLight);

    const nightLights = [];
    [[0, 11, 32, 38], [0, 34, 20, 44]].forEach(([x, y, z, dist]) => {
      const pl = new THREE.PointLight(0xff8a3a, 0.0, dist, 1.6);
      pl.position.set(x, y, z);
      scene.add(pl);
      nightLights.push(pl);
    });

    /* ==========================================================================
       6. 静态几何合批器 + 几何工具
          全场景 ~5000 个零件在构建时烘焙进少量 BufferGeometry（按材质 × 分区），
          运行时只剩几十个 draw call；分区保证视锥剔除仍然有效。
       ========================================================================== */
    const _v = new THREE.Vector3();
    const _nm = new THREE.Matrix3();
    const _m = new THREE.Matrix4();
    const _q = new THREE.Quaternion();
    const _e = new THREE.Euler();
    const _s = new THREE.Vector3();
    const _p = new THREE.Vector3();
    const _col = new THREE.Color();

    class GeoBuilder {
      constructor() { this.b = {}; }
      // opt.sway = { y0, h, phase } → 写入风摆权重/相位
      add(key, g, m, color, opt) {
        const B = this.b[key] || (this.b[key] = { p: [], n: [], u: [], c: [], i: [], w: [], ph: [], off: 0, sway: false });
        const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv, gc = g.attributes.color;

        _nm.getNormalMatrix(m);

      // 以 TRS 放置
      put(key, g, x, y, z, ry, sx, sy, sz, color, opt) {

        const B = this.b[key];

        g.setAttribute('normal', new THREE.Float32BufferAttribute(B.n, 3));

        g.setAttribute('color', new THREE.Float32BufferAttribute(B.c, 3));
        if (B.sway) {
          g.setAttribute('aWeight', new THREE.Float32BufferAttribute(B.w, 1));

    /* ---- 带「米制 UV」的基础几何：贴图尺寸 T 米，木纹沿长边 ---- */
    const _geoCache = new Map();
    function boxGeo(w, h, d, T = 2, grain = true) {
      const key = `b${w.toFixed(3)}|${h.toFixed(3)}|${d.toFixed(3)}|${T}|${grain}`;
      let g = _geoCache.get(key);
      if (g) return g;
      g = new THREE.BoxGeometry(w, h, d);
      const uv = g.attributes.uv;
      const faces = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];      // px nx py ny pz nz 的 (u 范围, v 范围)
      for (let f = 0; f < 6; f++) {
        const a = faces[f][0], b = faces[f][1];
        for (let k = 0; k < 4; k++) {
          const i = f * 4 + k, u = uv.getX(i), v = uv.getY(i);
          if (grain && a > b) uv.setXY(i, v * b / T, u * a / T); else uv.setXY(i, u * a / T, v * b / T);
        }
      }
      _geoCache.set(key, g);
      return g;
    }
    function cylGeo(rt, rb, h, seg = 12, T = 2, open = false) {
      const key = `c${rt.toFixed(3)}|${rb.toFixed(3)}|${h.toFixed(3)}|${seg}|${T}|${open}`;
      let g = _geoCache.get(key);
      if (g) return g;
      g = new THREE.CylinderGeometry(rt, rb, h, seg, 1, open);
      const uv = g.attributes.uv, circ = Math.PI * (rt + rb);
      for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * circ / T, uv.getY(i) * h / T);
      _geoCache.set(key, g);
      return g;
    }
    // 方锥台（斗）：上宽下窄
    function douGeo(hsTop, hsBot, h) {
      const key = `d${hsTop}|${hsBot}|${h}`;
      let g = _geoCache.get(key);
      if (g) return g;
      g = new THREE.CylinderGeometry(hsTop * 1.4142, hsBot * 1.4142, h, 4, 1);
      g.rotateY(Math.PI / 4);
      _geoCache.set(key, g);
      return g;
    }

    /* ---- 正八棱柱（面心朝 +Z），外接半径或内切半径二选一；米制 UV ---- */
    function octPrismGeo(apothem, y0, y1, T = 3, caps = true, sides = 8) {
      const key = `o${apothem.toFixed(3)}|${y0.toFixed(3)}|${y1.toFixed(3)}|${T}|${caps}|${sides}`;
      let g = _geoCache.get(key);
      if (g) return g;
      const half = Math.PI / sides, R = apothem / Math.cos(half), w = 2 * R * Math.sin(half), H = y1 - y0;
      const P = [], N = [], U = [], I = [];
      const quad = (a, b, c, d, n, ua, ub, uc, ud) => {
        const o = P.length / 3;
        [a, b, c, d].forEach((p) => { P.push(p[0], p[1], p[2]); N.push(n[0], n[1], n[2]); });
        U.push(...ua, ...ub, ...uc, ...ud); I.push(o, o + 1, o + 2, o, o + 2, o + 3);
      };
      for (let j = 0; j < sides; j++) {
        const a = j * 2 * half, nx = Math.sin(a), nz = Math.cos(a), rx = Math.cos(a), rz = -Math.sin(a);
        const L = [nx * apothem - rx * w / 2, nz * apothem - rz * w / 2], Rr = [nx * apothem + rx * w / 2, nz * apothem + rz * w / 2];
        quad([L[0], y0, L[1]], [Rr[0], y0, Rr[1]], [Rr[0], y1, Rr[1]], [L[0], y1, L[1]], [nx, 0, nz],
          [0, 0], [w / T, 0], [w / T, H / T], [0, H / T]);
      }
      if (caps) {
        for (const top of [true, false]) {
          const y = top ? y1 : y0, ny = top ? 1 : -1, o = P.length / 3;
          P.push(0, y, 0); N.push(0, ny, 0); U.push(0.5, 0.5);
          for (let j = 0; j <= sides; j++) {
            const t = j * 2 * half - half;
            P.push(Math.sin(t) * R, y, Math.cos(t) * R); N.push(0, ny, 0); U.push(Math.sin(t) * R / T, Math.cos(t) * R / T);
          }
          for (let j = 0; j < sides; j++) top ? I.push(o, o + 1 + j, o + 2 + j) : I.push(o, o + 2 + j, o + 1 + j);
        }
      }
      g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
      g.setIndex(I);
      _geoCache.set(key, g);
      return g;
    }

    /* ---- 顶点色小工具 ---- */
    function tint(hex, mul = 1, jitter = 0) {

    const C_TIMBER = tint(0xffffff, 1.0), C_TIMBER_DK = tint(0xffffff, 0.66), C_TIMBER_LT = tint(0xffffff, 1.18);
    const C_WHITE = tint(0xffffff);

    /* ---- 参数化「瓦屋面」：封闭壳体 = 瓦面 + 椽底 + 檐口封板 ，u: 0=内沿(上) → 1=檐口 ---- */
    // 以面心「内切半径」a 参数化，屋角翼角起翘；返回 { top, under, fascia, y(), under() } 方便后续对位
    function roofShape(o) {
      // o: sides, Ain, Aout, D(落差), lift(翼角起翘), curve(举折), y0(内沿顶面标高), th0, th1
      const sides = o.sides || 8, half = Math.PI / sides, sector = half * 2;
      const profile = (u) => -o.D * (1 - Math.pow(1 - u, o.curve || 1.55)) + o.D * 0.05 * Math.pow(u, 5);
      const thick = (u) => o.th0 + o.th1 * u;
      const pt = (u, theta, under) => {
        let local = (((theta + half) % sector) + sector) % sector - half;
        const cw = Math.abs(local) / half;
        const a = o.Ain + (o.Aout - o.Ain) * u;
        let r = a / Math.cos(local);
        r *= 1 + (o.flare === undefined ? 0.065 : o.flare) * Math.pow(u, 3) * Math.pow(cw, 4);   // 角梁挑出
        const y = o.y0 + profile(u) + o.lift * Math.pow(u, 2.2) * Math.pow(cw, 2.5) - (under ? thick(u) : 0);
        return [Math.sin(theta) * r, y, Math.cos(theta) * r];
      };
      return {
        pt, profile, thick,
        topAtFace: (a) => o.y0 + profile(clamp((a - o.Ain) / (o.Aout - o.Ain), 0, 1)),
        underAtFace: (a) => { const u = clamp((a - o.Ain) / (o.Aout - o.Ain), 0, 1); return o.y0 + profile(u) - thick(u); }
      };
    }
    function roofGeometries(o) {
      const sides = o.sides || 8, perSide = 12, nu = 16, nt = sides * perSide, half = Math.PI / sides;
      const S = roofShape(o);
      const grid = (under) => {
        const P = [], U = [], I = [];
        for (let i = 0; i <= nu; i++) {
          const u = Math.pow(i / nu, 0.9);
          for (let j = 0; j <= nt; j++) {
            const th = (j / nt) * Math.PI * 2;
            const p = S.pt(u, th, under);
            P.push(p[0], p[1], p[2]);
            // 米制 UV：沿屋面弧长（u 方向随周长，v 沿坡向）
            const ring = (o.Ain + (o.Aout - o.Ain) * u) * Math.tan(half) * 2 * sides;
            U.push((j / nt) * ring / 5.44, (1 - u) * (o.Aout - o.Ain) * 1.12 / 5.44);
          }
        }
        for (let i = 0; i < nu; i++) for (let j = 0; j < nt; j++) {
          const a = i * (nt + 1) + j, b = a + 1, c = a + (nt + 1), d = c + 1;
          under ? I.push(a, b, c, b, d, c) : I.push(a, c, b, b, c, d);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
        g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
        g.setIndex(I); g.computeVertexNormals();
        return g;
      };
      const top = grid(false), under = grid(true);
      // 檐口封板（连接 top 与 under 的 u=1 圈）
      const P = [], I = [], U = [];
      for (let j = 0; j <= nt; j++) {
        const th = (j / nt) * Math.PI * 2, a = S.pt(1, th, false), b = S.pt(1, th, true);
        P.push(a[0], a[1], a[2], b[0], b[1], b[2]); U.push(j * 0.25, 0, j * 0.25, o.th0 + o.th1);
      }
      for (let j = 0; j < nt; j++) { const k = j * 2; I.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
      const fascia = new THREE.BufferGeometry();
      fascia.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      fascia.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
      fascia.setIndex(I); fascia.computeVertexNormals();
      return { top, under, fascia, S };
    }

    /* ==========================================================================
       7. 塔身竖向布局（纯数值推算）
          每一层的屋面标高由「斗拱外跳端点」反推：椽底恰好压在拱头之上，
          墙体顶到椽底、平座压在下层屋面内沿——所有构件按同一张表对位，不再各写各的 Y 值。
       ========================================================================== */
    const DG_PROJ = 1.84, DG_H = 1.34, BEAM_H = 0.42;     // 斗拱出跳 / 高 / 阑额厚（比例 1.0）
    const PZ_SCALE = 0.8;                                  // 平座斗拱缩尺
    const DECK_T = 0.3;                                    // 平座楼板厚

    function solveRoof(spec, tipA, tipTop) {
      const o = Object.assign({ curve: 1.55, th0: 0.26, th1: 0.2, y0: 0, flare: 0.065 }, spec);
      o.D = (o.Aout - o.Ain) * (spec.pitch || 0.38);
      const S0 = roofShape(o);
      o.y0 = tipTop + 0.06 - S0.underAtFace(tipA);          // 椽底刚好压过拱头
      return { opt: o, S: roofShape(o) };
    }

    function computePagodaLayout() {
      const A = [11.64, 10.35, 9.52, 8.68, 7.85];          // 各层柱头内切半径（逐层收分）
      const H = [0, 4.5, 4.3, 4.1, 3.9];                   // 二~五层墙高
      const Av = 14.6;                                     // 副阶檐柱
      const out = { Av, A, levels: [] };

      // —— 副阶（重檐下檐）
      const v = { colTop: 5.2, beamY: 5.2, s: 1.0 };
      v.tipA = Av + 0.15 + DG_PROJ * v.s; v.tipTop = v.beamY + BEAM_H + DG_H * v.s;
      v.roof = solveRoof({ sides: 8, Ain: A[0] - 0.45, Aout: v.tipA + 1.45, lift: 1.1, pitch: 0.4 }, v.tipA, v.tipTop);
      out.veranda = v;

      // —— 首层
      const l1 = { n: 1, A: A[0], floorY: 0, s: 1.0 };
      l1.wallTop = v.roof.opt.y0 + 1.85;                   // 副阶屋面之上露出约 1.85m 墙身（挂「天柱地轴」）
      l1.beamY = l1.wallTop;
      l1.tipA = l1.A + 0.15 + DG_PROJ * l1.s; l1.tipTop = l1.beamY + BEAM_H + DG_H * l1.s;
      l1.roof = solveRoof({ sides: 8, Ain: A[1] - 0.3, Aout: l1.tipA + 1.4, lift: 1.0, pitch: 0.38 }, l1.tipA, l1.tipTop);
      out.levels.push(l1);

      for (let i = 1; i < 5; i++) {

        L.pzTipA = Aw + 0.15 + DG_PROJ * PZ_SCALE;
        L.deckY = L.pzY + BEAM_H + DG_H * PZ_SCALE + DECK_T;
        L.floorY = L.deckY;
        L.wallTop = L.deckY + H[i];

        L.tipA = Aw + 0.15 + DG_PROJ * L.s; L.tipTop = L.beamY + BEAM_H + DG_H * L.s;

        else L.roof = solveRoof({ sides: 8, Ain: 0.7, Aout: L.tipA + 1.55, lift: 0.7, pitch: 0.46, curve: 1.7 }, L.tipA, L.tipTop);
        out.levels.push(L);

      return out;
    }

    /* ==========================================================================
       8. 塔身构件：斗拱 · 屋面 · 柱廊 · 门窗 · 勾栏
       ========================================================================== */
    const PI8 = Math.PI / 8, PI4 = Math.PI / 4;
    const _ml = new THREE.Matrix4(), _mw = new THREE.Matrix4();
    function part(B, key, geo, M0, lx, ly, lz, rx, color) {

      _mw.multiplyMatrices(M0, _ml);
      B.add(key, geo, _mw, color);

    // —— 一攒斗拱（局部坐标：+Z 向外、原点在阑额上皮），只生成一次，之后整体烘焙到各处
    const DOUGONG_GEO = (function () {
      const T = new GeoBuilder(), I = new THREE.Matrix4();
      part(T, 't', douGeo(0.34, 0.22, 0.30), I, 0, 0.15, 0, 0, C_TIMBER_DK);                  // 栌斗
      part(T, 't', boxGeo(0.62, 0.14, 0.24, 2), I, 0, 0.04, 0, 0, C_TIMBER_DK);               // 斗下垫板
      for (let t = 0; t < 3; t++) {
        const armY = 0.40 + 0.25 * t, proj = 0.55 + 0.645 * t, len = proj + 0.25;
        part(T, 't', boxGeo(0.20, 0.22, len, 2), I, 0, armY, (proj - 0.25) / 2, 0, t === 1 ? C_TIMBER : C_TIMBER_DK);   // 华拱
        const cw = 0.95 + 0.5 * t;
        part(T, 't', boxGeo(cw, 0.19, 0.20, 2), I, 0, armY + 0.18, proj - 0.05, 0, C_TIMBER_LT);                         // 瓜子拱 / 慢拱
        for (const sx of [-1, 1]) part(T, 't', douGeo(0.12, 0.085, 0.15), I, sx * (cw / 2 - 0.1), armY + 0.31, proj - 0.05, 0, C_TIMBER_DK); // 散斗
        part(T, 't', douGeo(0.12, 0.085, 0.15), I, 0, armY + 0.31, proj + 0.02, 0, C_TIMBER_DK);
      }
      part(T, 't', boxGeo(0.17, 0.21, 1.6, 2), I, 0, 0.74, 1.0, 0.30, C_TIMBER);               // 下昂
      part(T, 't', boxGeo(0.15, 0.19, 0.5, 2), I, 0, 0.50, 1.78, 0.30, C_TIMBER_DK);           // 昂嘴
      return T.geometry('t');
    })();
    const _gM = new THREE.Matrix4();
    function dougong(B, key, x, y, z, yaw, s) {
      _e.set(0, yaw, 0); _q.setFromEuler(_e);
      _gM.compose(_p.set(x, y, z), _q, _s.set(s, s, s));
      B.add(key, DOUGONG_GEO, _gM, C_WHITE);
    }

    // —— 在八边形某一面局部坐标放置：lx 沿面宽、lz 向外
    function faceXYZ(j, apo, lx, lz) {
      const a = j * PI4, sn = Math.sin(a), cs = Math.cos(a);
      return [sn * (apo + lz) + cs * lx, cs * (apo + lz) - sn * lx, a];
    }
    function faceBox(B, key, w, h, d, j, apo, lx, y, lz, color, T = 2, grain = true) {
      const p = faceXYZ(j, apo, lx, lz);
      B.put(key, boxGeo(w, h, d, T, grain), p[0], y, p[1], p[2], 1, 1, 1, color);
    }
    function cornerXZ(j, A) {                         // 第 j 个角点（面 j 与 j+1 之间）

    // —— 一圈斗拱（阑额 + 面上补间铺作 + 转角铺作）
    function dougongRing(B, chunk, A, beamY, s, sparse) {
      B.add(`timber@${chunk}`, octPrismGeo(A + 0.15, beamY, beamY + BEAM_H, 3, true), _m.identity(), tint(0xffffff, 0.92));
      const w = faceW(A + 0.15), top = beamY + BEAM_H;
      for (let j = 0; j < 8; j++) {
        (sparse ? [-0.3, 0, 0.3] : [-0.35, -0.19, 0, 0.19, 0.35]).forEach((u) => {          // 柱头铺作 ±0.19 + 补间铺作
          const p = faceXYZ(j, A + 0.15, u * w, 0);
          dougong(B, `timber@${chunk}`, p[0], top, p[1], p[2], s);
        });
        const c = cornerXZ(j, A + 0.15);               // 转角铺作沿角平分线外挑
        dougong(B, `timber@${chunk}`, c[0], top, c[1], c[2], s * 1.08);
      }
    }

    // —— 圆柱（卷杀：上细下粗）+ 柱础
    function column(B, chunk, x, y0, y1, z, r, stone) {
      B.put(`timber@${chunk}`, cylGeo(r * 0.88, r, y1 - y0, 12, 2), x, (y0 + y1) / 2, z, 0, 1, 1, 1, tint(0xffffff, 1.0, 0.1));
      if (stone) {
        B.put(`stone@${chunk}`, cylGeo(r * 1.45, r * 1.62, 0.3, 12, 2), x, y0 - 0.1, z, 0, 1, 1, 1, tint(0xffffff, 1.0, 0.1));
        B.put(`stone@${chunk}`, cylGeo(r * 1.62, r * 1.7, 0.1, 12, 2), x, y0 - 0.29, z, 0, 1, 1, 1, tint(0xffffff, 0.9));
      }
    }
    function colonnade(B, chunk, A, y0, y1, r, stone, doorFaces) {
      const w = faceW(A);
      for (let j = 0; j < 8; j++) {
        const c = cornerXZ(j, A); column(B, chunk, c[0], y0, y1, c[1], r, stone);
        [-0.19, 0.19].forEach((u) => { const p = faceXYZ(j, A, u * w, 0); column(B, chunk, p[0], y0, y1, p[1], r, stone); });
      }
    }

    // —— 门洞（暗部 + 门框 + 两扇外开门板）
    function doorway(B, chunk, j, apo, y0, y1, wid) {
      const h = y1 - y0, p = faceXYZ(j, apo, 0, 0.03), a = p[2];
      const g = new THREE.PlaneGeometry(wid, h);
      B.put(`dark@${chunk}`, g, p[0], y0 + h / 2, p[1], a, 1, 1, 1, tint(0x1a0e08));
      const inner = new THREE.PlaneGeometry(wid * 0.55, h * 0.8);
      const q = faceXYZ(j, apo, 0, 0.04);
      B.put(`dark@${chunk}`, inner, q[0], y0 + h * 0.42, q[1], a, 1, 1, 1, tint(0x3a2412));          // 殿内微亮的佛龛纵深
      faceBox(B, `timber@${chunk}`, 0.3, h + 0.35, 0.36, j, apo, -(wid / 2 + 0.15), y0 + h / 2 + 0.17, 0.12, tint(0xffffff, 0.95));
      faceBox(B, `timber@${chunk}`, 0.3, h + 0.35, 0.36, j, apo, (wid / 2 + 0.15), y0 + h / 2 + 0.17, 0.12, tint(0xffffff, 0.95));
      faceBox(B, `timber@${chunk}`, wid + 0.75, 0.36, 0.38, j, apo, 0, y1 + 0.18, 0.12, tint(0xffffff, 0.9));
      faceBox(B, `stone@${chunk}`, wid + 0.9, 0.16, 0.7, j, apo, 0, y0 - 0.02, 0.3, C_WHITE, 3, false);   // 门槛石
      const lw = wid * 0.44, phi = 1.15;
      [[1, 1], [-1, -1]].forEach(([side]) => {                       // 门扇绕门轴外开
        const hx = side * (wid / 2 - 0.02), cx = hx - side * Math.cos(phi) * lw / 2, cz = 0.18 + Math.sin(phi) * lw / 2;
        const pp = faceXYZ(j, apo, cx, cz);
        B.put(`timber@${chunk}`, boxGeo(lw, h * 0.95, 0.1, 2), pp[0], y0 + h * 0.475, pp[1], a + side * phi, 1, 1, 1, tint(0xffffff, 0.8));
      });
    }
    // —— 格扇窗：窗芯平面 + 木框
    function windowPanel(B, chunk, j, apo, lx, y0, y1, wid) {
      const h = y1 - y0, p = faceXYZ(j, apo, lx, 0.04);
      B.put(`window@${chunk}`, new THREE.PlaneGeometry(wid, h), p[0], y0 + h / 2, p[1], p[2], 1, 1, 1, C_WHITE);
      faceBox(B, `timber@${chunk}`, wid + 0.3, 0.16, 0.22, j, apo, lx, y1 + 0.08, 0.1, tint(0xffffff, 0.9));
      faceBox(B, `timber@${chunk}`, wid + 0.3, 0.16, 0.22, j, apo, lx, y0 - 0.08, 0.1, tint(0xffffff, 0.9));
      faceBox(B, `timber@${chunk}`, 0.16, h + 0.32, 0.22, j, apo, lx - wid / 2 - 0.08, y0 + h / 2, 0.1, tint(0xffffff, 0.9));
      faceBox(B, `timber@${chunk}`, 0.16, h + 0.32, 0.22, j, apo, lx + wid / 2 + 0.08, y0 + h / 2, 0.1, tint(0xffffff, 0.9));
    }

    // —— 平座勾栏（望柱 + 寻杖 + 华板）
    function railing(B, chunk, apo, y) {
      const w = faceW(apo), n = Math.max(3, Math.round(w / 1.45)), step = w / n;
      for (let j = 0; j < 8; j++) {
        for (let k = 0; k <= n; k++) {
          const lx = -w / 2 + k * step;
          faceBox(B, `timber@${chunk}`, 0.17, 1.12, 0.17, j, apo, lx, y + 0.56, 0, tint(0xffffff, 1.05), 2);
          const p = faceXYZ(j, apo, lx, 0);
          B.put(`timber@${chunk}`, boxGeo(0.23, 0.12, 0.23, 2), p[0], y + 1.18, p[1], p[2], 1, 1, 1, C_TIMBER_LT);   // 望柱头
        }
        faceBox(B, `timber@${chunk}`, w, 0.13, 0.15, j, apo, 0, y + 1.0, 0, C_TIMBER_LT);            // 寻杖
        faceBox(B, `timber@${chunk}`, w, 0.11, 0.13, j, apo, 0, y + 0.24, 0, C_TIMBER);              // 地栿
        faceBox(B, `timber@${chunk}`, w * 0.985, 0.5, 0.06, j, apo, 0, y + 0.6, 0, C_TIMBER_DK);       // 华板
      }
    }

    // —— 屋面：瓦面 / 椽底 / 檐口封板 / 八条戗脊 / 套兽 / 铁马
    function addRoof(B, chunk, rf, isTop) {
      const o = rf.opt, geos = roofGeometries(o);
      const P = geos.top.attributes.position, cols = new Float32Array(P.count * 3);
      for (let k = 0; k < P.count; k++) {                         // 瓦色：低频斑驳 + 檐口处更脏
        const x = P.getX(k), z = P.getZ(k), n = vnoise(x * 0.42, z * 0.42) * 0.34 + hash2(Math.round(x * 3), Math.round(z * 3)) * 0.1;
        const c = 0.78 + n; cols[k * 3] = c; cols[k * 3 + 1] = c; cols[k * 3 + 2] = c * 0.97;
      }
      geos.top.setAttribute('color', new THREE.BufferAttribute(cols, 3));
      B.add(`tile@${chunk}`, geos.top, _m.identity(), C_WHITE);
      B.add(`rafter@${chunk}`, geos.under, _m.identity(), tint(0xffffff, 0.95));
      B.add(`timber@${chunk}`, geos.fascia, _m.identity(), tint(0xffffff, 0.74));
      const S = geos.S, ridgeC = tint(0xffffff, 0.8), tg = new THREE.Vector3();
      const NS = o.sides || 8;
      for (let k = 0; k < NS; k++) {
        const th = (k + 0.5) * (Math.PI * 2 / NS), pts = [];
        const u0 = isTop ? 0.05 : 0.02;
        for (let i = 0; i <= 14; i++) {
          const u = u0 + (1 - u0) * (i / 14), p = S.pt(u, th, false);
          pts.push(new THREE.Vector3(p[0], p[1] + 0.13, p[2]));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tube = new THREE.TubeGeometry(curve, 28, isTop ? 0.24 : 0.21, 6, false);
        B.add(`tile@${chunk}`, tube, _m.identity(), ridgeC);
        const e = S.pt(1, th, false), eu = S.pt(1, th, true);
        B.put(`tile@${chunk}`, cylGeo(0.22, 0.3, 0.55, 8, 1), e[0], e[1] + 0.34, e[2], 0, 1, 1, 1, ridgeC);         // 套兽
        B.put(`tile@${chunk}`, boxGeo(0.3, 0.38, 0.46, 1, false), e[0] * 0.965, e[1] + 0.55, e[2] * 0.965, th, 1, 1, 1, ridgeC);   // 鸱吻式脊端
        for (let q = 1; q <= 3; q++) {                                                                                    // 仙人走兽
          const pp = S.pt(1 - q * 0.045, th, false);
          B.put(`tile@${chunk}`, boxGeo(0.2, 0.26, 0.2, 1, false), pp[0], pp[1] + 0.34, pp[2], th, 1, 1, 1, ridgeC);
        }
        B.put(`iron@${chunk}`, cylGeo(0.02, 0.02, 0.4, 5, 1), eu[0] * 0.992, eu[1] - 0.18, eu[2] * 0.992, 0, 1, 1, 1, tint(0x5a5148));  // 铁马：吊索
        B.put(`iron@${chunk}`, cylGeo(0.1, 0.17, 0.3, 8, 1), eu[0] * 0.992, eu[1] - 0.5, eu[2] * 0.992, 0, 1, 1, 1, tint(0x6e6254)); // 铁马：风铎
      }
    }

    /* ==========================================================================
       9. 总装：副阶 + 五层六檐 + 历代名匾 + 铁刹
       ========================================================================== */
    const LAY = computePagodaLayout();
    const TW = new GeoBuilder();                       // 塔身（局部坐标：y=0 即上层台基面）
    const PAGODA_BASE_Y = 4.1;
    const IDM = new THREE.Matrix4();

    function wallBlock(chunk, A, y0, wallTop, roofS) {
      TW.add(`plaster@${chunk}`, octPrismGeo(A - 0.12, y0, wallTop, 3, false), IDM, C_WHITE);
      const upTo = roofS.underAtFace(A - 0.1) + 0.3;               // 墙一直砌到椽底以上，屋面与墙体之间不留缝
      TW.add(`timber@${chunk}`, octPrismGeo(A - 0.12, wallTop, upTo, 3, true), IDM, tint(0xffffff, 0.5));
    }

    // 匾额：木框（烘焙）+ 贴图面板（独立网格，字体就绪后重绘）
    const plaqueMeshes = [];
    function hangPlaque(opts, j, apo, lx, y, lz, w, h) {
      const p = faceXYZ(j, apo, lx, lz + 0.09);
      const yaw = p[2];
      faceBox(TW, 'timber@plq', w + 0.16, h + 0.16, 0.14, j, apo, lx, y, lz, tint(0xffffff, 0.82));
      const mat = createPlaqueMaterial(Object.assign({ borderColor: '#4a2518' }, opts));
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.position.set(p[0], y, p[1]);
      mesh.rotation.y = yaw;
      mesh.matrixAutoUpdate = false; mesh.updateMatrix();
      plaqueMeshes.push(mesh);
      // 悬挂木件：从墙面（或栏杆）拉到匾背
      [-1, 1].forEach((sd) => faceBox(TW, 'timber@plq', 0.14, 0.14, Math.max(0.3, lz + 0.14), j, apo, lx + sd * (w / 2 - 0.3), y + h * 0.28, (lz - 0.14) / 2 - 0.02, C_TIMBER_DK));
    }

    // —— 副阶
    (function buildVeranda() {
      const v = LAY.veranda, Av = LAY.Av;
      colonnade(TW, 'v', Av, 0.3, v.colTop, 0.3, true);
      dougongRing(TW, 'v', Av, v.beamY, v.s);
      addRoof(TW, 'v', v.roof, false);
      // 万古观瞻：吊在副阶明间额枋下
      const bay = faceXYZ(0, Av, 0, -0.1);
      [-1.15, 1.15].forEach((x) => faceBox(TW, 'timber@plq', 0.1, 0.5, 0.1, 0, Av, x, 4.72, -0.1, C_TIMBER_DK));
      hangPlaque({ text: '萬古觀瞻', bgStyle: 'royalBlue', borderColor: '#2d1c12' }, 0, Av, 0, 4.4, -0.1, 3.1, 1.05);
    })();

    // —— 五层
    (function buildStories() {
      LAY.levels.forEach((lv, idx) => {
        const chunk = 's' + lv.n, A = lv.A, S = lv.roof.S, isTop = lv.n === 5;
        const floor = lv.floorY, w = faceW(A);
        if (lv.n === 1) {
          wallBlock(chunk, A, 0, lv.wallTop, S);
          colonnade(TW, chunk, A, 0.25, lv.wallTop, 0.27, true);
        } else {
          // 平座：暗层（下层屋面内沿起）+ 斗拱 + 楼板 + 勾栏
          TW.add(`timber@${chunk}`, octPrismGeo(A + 0.1, lv.pzY - 0.7, lv.deckY - DECK_T, 3, true), IDM, tint(0xffffff, 0.55));
          dougongRing(TW, chunk, A, lv.pzY, PZ_SCALE, true);
          TW.add(`timber@${chunk}`, octPrismGeo(A + 1.6, lv.deckY - DECK_T, lv.deckY, 3, true), IDM, tint(0xffffff, 0.86));
          railing(TW, chunk, A + 1.45, lv.deckY);
          wallBlock(chunk, A, lv.deckY, lv.wallTop, S);
          colonnade(TW, chunk, A, lv.deckY, lv.wallTop, 0.22, false);
        }
        dougongRing(TW, chunk, A, lv.beamY, lv.s);
        addRoof(TW, chunk, lv.roof, isTop);

        // 门窗
        const apo = A - 0.12;
        const wy0 = lv.n === 1 ? 2.6 : floor + 0.9, wy1 = lv.n === 1 ? 7.8 : lv.wallTop - 1.7;
        for (let j = 0; j < 8; j++) {
          const cardinal = j % 2 === 0;
          const bay = 0.38 * w - 0.44;                                  // 明间净宽（扣掉两侧柱径）
          if (cardinal) doorway(TW, chunk, j, apo, floor + (lv.n === 1 ? 0.25 : 0.12), lv.n === 1 ? 6.4 : lv.wallTop - 1.7, Math.min(lv.n === 1 ? 2.5 : 2.1, bay - 0.62));
          else windowPanel(TW, chunk, j, apo, 0, wy0, wy1, Math.min(2.0, bay - 0.4));
          [-1, 1].forEach((sd) => windowPanel(TW, chunk, j, apo, sd * 0.345 * w, wy0, wy1, 0.2 * w));
        }
      });

      // 名匾
      const L = LAY.levels;
      hangPlaque({ text: '天柱地軸', bgStyle: 'white' }, 0, L[0].A, 0, L[0].wallTop - 0.92, 0.42, 3.4, 1.18);
      hangPlaque({ text: '正直', bgStyle: 'white' }, 0, L[1].A + 1.45, 0, L[1].deckY + 0.62, 0.2, 2.1, 0.78);
      hangPlaque({ text: '天宮高聳', bgStyle: 'white' }, 0, L[1].A, 0, L[1].wallTop - 0.95, 0.42, 3.3, 1.15);
      hangPlaque({ text: '釋迦塔', isVertical: true, bgStyle: 'white' }, 0, L[2].A, 0, L[2].wallTop - 0.35 - 1.575, 0.58, 1.55, 3.15);
      hangPlaque({ text: '百尺蓮開', bgStyle: 'white' }, 1, L[2].A, 0, L[2].wallTop - 0.95, 0.42, 2.85, 1.0);
      hangPlaque({ text: '天下奇觀', bgStyle: 'white' }, 0, L[3].A, 0, L[3].wallTop - 0.95, 0.42, 3.2, 1.12);
      hangPlaque({ text: '峻極神工', bgStyle: 'darkGold' }, 0, L[4].A, 0, L[4].wallTop - 0.92, 0.42, 3.0, 1.05);
    })();

    // —— 铁刹 + 八根拽链
    (function buildFinial() {
      const top = LAY.levels[4].roof, F0 = LAY.apexY - 0.35, K = 'iron@top';
      const flat = (R, tube) => { const g = new THREE.TorusGeometry(R, tube, 6, 18); g.rotateX(Math.PI / 2); return g; };
      TW.put('tile@top', octPrismGeo(1.5, F0 - 1.0, F0 + 1.1, 3, true), 0, 0, 0, 0, 1, 1, 1, tint(0xffffff, 0.9));   // 下探入屋面，不留缝
      TW.put('tile@top', cylGeo(1.0, 1.5, 0.5, 8, 3), 0, F0 + 1.35, 0, 0, 1, 1, 1, tint(0xffffff, 0.95));
      const ironC = tint(0x4a433c), ironD = tint(0x2e2925);
      TW.put(K, new THREE.SphereGeometry(1.02, 16, 10), 0, F0 + 1.95, 0, 0, 1, 0.85, 1, ironC);
      TW.put(K, cylGeo(0.13, 0.17, 5.6, 8, 1), 0, F0 + 4.5, 0, 0, 1, 1, 1, ironD);
      for (let r = 0; r < 9; r++) TW.put(K, flat(0.92 - r * 0.07, 0.075), 0, F0 + 2.75 + r * 0.36, 0, 0, 1, 1, 1, ironC);
      const moon = new THREE.TorusGeometry(0.46, 0.065, 6, 16, Math.PI * 1.35); moon.rotateZ(-Math.PI * 1.175);
      TW.put(K, moon, 0, F0 + 6.2, 0, 0, 1, 1, 1, ironC);
      TW.put(K, new THREE.SphereGeometry(0.3, 10, 8), 0, F0 + 6.95, 0, 0, 1, 1.25, 1, tint(0x9a7b3a));
      const hub = new THREE.Vector3(0, F0 + 5.6, 0);
      for (let k = 0; k < 8; k++) {
        const p = top.S.pt(0.9, (k + 0.5) * PI4, false), end = new THREE.Vector3(p[0], p[1] + 0.3, p[2]);
        const mid = hub.clone().lerp(end, 0.5); mid.y -= 0.22;
        const g = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(hub, mid, end), 14, 0.05, 5, false);
        TW.add(K, g, IDM, ironD);
      }
    })();

    // —— 烘焙成网格（按 材质@分区 合批）
    const pagodaRoot = new THREE.Group();
    pagodaRoot.position.set(0, PAGODA_BASE_Y, 0);
    Object.keys(TW.b).forEach((key) => {
      const name = key.split('@')[0];
      const mesh = TW.mesh(key, MAT[name], { cast: name !== 'dark', receive: true });
      if (mesh) pagodaRoot.add(mesh);
    });
    plaqueMeshes.forEach((m) => pagodaRoot.add(m));
    const templeGroup = new THREE.Group();
    templeGroup.add(pagodaRoot);
    scene.add(templeGroup);
    console.info('[佛宫寺释迦塔] 塔通高(含台基与塔刹) ≈', (LAY.apexY + PAGODA_BASE_Y + 7.3).toFixed(1), 'm');

    /* ==========================================================================
       10. 双层台基：方形月台 + 八角须弥座 + 两段踏跺 + 石栏 + 石狮
           踏跺与台面严丝合缝（上一版踏步悬空在八角台之外，已重算）
       ========================================================================== */
    const ST = new GeoBuilder();
    const PLAT = { lowerTop: 2.0, upperTop: 4.1, upperA: 19.7, lowerHalf: 28.6, stairHalf: 3.6 };
    const STONE_C = () => tint(0xffffff, 1.0, 0.1);

    function stoneBox(w, h, d, x, y, z, color, T = 3) { ST.put('stone@plat', boxGeo(w, h, d, T, false), x, y, z, 0, 1, 1, 1, color || STONE_C()); }
    function addRotX(B, key, geo, x, y, z, rx, color) {
      _e.set(rx, 0, 0); _q.setFromEuler(_e);
      _m.compose(_p.set(x, y, z), _q, _s.set(1, 1, 1));
      B.add(key, geo, _m, color);
    }

    // —— 方形月台（圭角 / 束腰 / 压沿）
    stoneBox(PLAT.lowerHalf * 2 + 0.6, 0.45, PLAT.lowerHalf * 2 + 0.6, 0, 0.225, 0, tint(0xffffff, 0.95));
    stoneBox(56.6, 1.3, 56.6, 0, 1.1, 0, tint(0xffffff, 0.82));
    stoneBox(PLAT.lowerHalf * 2, 0.25, PLAT.lowerHalf * 2, 0, 1.875, 0, tint(0xffffff, 1.05));
    // —— 八角台（须弥座）
    ST.add('stone@plat', octPrismGeo(20.1, 2.0, 2.45, 3, true), IDM, tint(0xffffff, 0.95));
    ST.add('stone@plat', octPrismGeo(19.4, 2.45, 3.65, 3, true), IDM, tint(0xffffff, 0.82));
    ST.add('stone@plat', octPrismGeo(PLAT.upperA, 3.65, 4.1, 3, true), IDM, tint(0xffffff, 1.05));

    // —— 踏跺：每级独立、互不重叠（避免共面 Z-fight）；两侧垂带 + 象眼
    function stairFlight(zBack, n, rise, tread, baseY, halfW) {
      for (let s = 0; s < n; s++) {
        const top = baseY + rise * (s + 1), zf = zBack + tread * (n - s), hgt = top - baseY;
        stoneBox(halfW * 2, hgt, tread, 0, baseY + hgt / 2, zf - tread / 2, tint(0xffffff, 1.0, 0.08), 2);
        [-1, 1].forEach((sd) => stoneBox(0.8, hgt + 0.55, tread, sd * (halfW + 0.4), baseY + (hgt + 0.55) / 2, zf - tread / 2, tint(0xffffff, 0.9, 0.06), 2));
      }
      const run = tread * n, th = Math.atan2(rise, tread), cth = Math.cos(th), zf0 = zBack + run, platTop = baseY + rise * n;
      const yLine = (z) => baseY + rise + 0.55 + (zf0 - z) * (rise / tread);        // 过各级垂带块前上角的斜线
      const zc = (zf0 + zBack) / 2, yc = yLine(zc) + 0.12 / cth, len = run / cth;
      [-1, 1].forEach((sd) => {
        addRotX(ST, 'stone@plat', boxGeo(0.9, 0.24, len, 2, false), sd * (halfW + 0.4), yc, zc, th, tint(0xffffff, 1.08));
        const he = yLine(zBack + 0.225) - platTop;                                   // 垂带上端的抱鼓石墩，托住斜板
        stoneBox(0.84, he, 0.45, sd * (halfW + 0.4), platTop + he / 2, zBack + 0.225, tint(0xffffff, 1.0), 2);
      });
    }
    stairFlight(PLAT.upperA, 10, 0.21, 0.5, PLAT.lowerTop, PLAT.stairHalf);                   // 月台 → 八角台 (y 2.0 → 4.1)
    stairFlight(PLAT.lowerHalf, 12, PLAT.lowerTop / 12, 0.45, 0, PLAT.stairHalf);              // 地面 → 月台   (y 0   → 2.0)

    // —— 石栏杆（望柱 + 栏板 + 寻杖）
    function stoneRail(x0, z0, x1, z1, y) {
      const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz), n = Math.max(1, Math.round(L / 2.1)), bay = L / n, yaw = Math.atan2(-dz, dx);
      for (let k = 0; k <= n; k++) {
        const px = x0 + dx * (k / n), pz = z0 + dz * (k / n);
        ST.put('stone@plat', boxGeo(0.3, 1.05, 0.3, 2, false), px, y + 0.525, pz, yaw, 1, 1, 1, tint(0xffffff, 1.05));
        ST.put('stone@plat', boxGeo(0.4, 0.2, 0.4, 2, false), px, y + 1.13, pz, yaw, 1, 1, 1, tint(0xffffff, 1.12));
      }
      for (let k = 0; k < n; k++) {
        const mx = x0 + dx * ((k + 0.5) / n), mz = z0 + dz * ((k + 0.5) / n);
        ST.put('stone@plat', boxGeo(bay - 0.3, 0.6, 0.16, 2, false), mx, y + 0.5, mz, yaw, 1, 1, 1, tint(0xffffff, 0.92, 0.06));     // 栏板
        ST.put('stone@plat', boxGeo(bay - 0.28, 0.14, 0.26, 2, false), mx, y + 0.9, mz, yaw, 1, 1, 1, tint(0xffffff, 1.08));        // 寻杖

    const WB = new GeoBuilder();                       // 世界坐标静态几何
    const COL_CIRCLES = [], COL_BOXES = [];            // 碰撞：圆 {x,z,r}；矩形 {x0,z0,x1,z1}

    const colBox = (x0, z0, x1, z1) => COL_BOXES.push({ x0: Math.min(x0, x1), z0: Math.min(z0, z1), x1: Math.max(x0, x1), z1: Math.max(z0, z1) });

    function wBox(key, w, h, d, x, y, z, color, T = 3, yaw = 0, grain = true) {

    function placePrefab(prefab, x, y, z, yaw) {

    function prefab(fn) {                              // 在原点生成一次，再整体烘焙到多处
      const P = new GeoBuilder(); fn(P);
      const out = {};
      Object.keys(P.b).forEach((k) => { out[k] = P.geometry(k); });

    }
    const sideXZ = (j, apo, lx, lz) => { const a = j * Math.PI / 2; return [Math.sin(a) * (apo + lz) + Math.cos(a) * lx, Math.cos(a) * (apo + lz) - Math.sin(a) * lx, a]; };

    /* —— 四角攒尖亭（山门 / 碑亭共用）—— */
    function pavilionPrefab({ half, colH, s, gateWalls }) {

    // —— 山门（正南）

    // —— 围墙（红泥墙 + 灰瓦压顶 + 壁柱）
    (function walls() {
      const C_WALL = tint(0xffffff, 0.95), C_CAP = tint(0xffffff, 0.8);

    /* ==========================================================================
       12. 自然景观：古槐 / 松柏 / 银杏 · 风摆草丛 · 野花 · 花圃 · 放生池 · 太湖石 · 萤火虫
       ========================================================================== */
    function putE(B, key, geo, x, y, z, rx, ry, rz, sx, sy, sz, color, opt) {
      _e.set(rx, ry, rz); _q.setFromEuler(_e);
      _m.compose(_p.set(x, y, z), _q, _s.set(sx, sy, sz));
      B.add(key, geo, _m, color, opt);
    }
    const POND = { x: -40, z: 90, r: 9.5 };
    const nearPaved = (x, z, m) =>
      (Math.abs(x) < 44 + m && Math.abs(z) < 44 + m) ||                         // 庭心方砖
      (Math.abs(x) < 6.6 + m && z > 30) || (Math.abs(z - 74) < 3.8 + m && Math.abs(x) < 76) ||   // 甬道 / 横道
      (Math.hypot(x - POND.x, z - POND.z) < POND.r + 2.2 + m) ||               // 水池
      ([-31, 31].some((px) => Math.abs(x - px) < 8.5 + m && Math.abs(z - 50) < 8.5 + m)) ||       // 碑亭
      (Math.abs(x) < 14 + m && z > WALL.zFront - 12);                          // 山门
    const insideWall = (x, z, m) => Math.abs(x) < WALL.x - m && z > WALL.zBack + m && z < WALL.zFront - m;

    /* —— 太湖石：二十面体 + 噪声位移 —— */
    function rockGeo(seed) {
      const g = new THREE.IcosahedronGeometry(1, 2), P = g.attributes.position;
      for (let i = 0; i < P.count; i++) {
        _v.fromBufferAttribute(P, i);
        const n = vnoise(_v.x * 1.7 + seed, _v.y * 1.7 + _v.z * 1.3) * 0.55 + vnoise(_v.x * 4 + _v.z * 3, _v.y * 4 + seed) * 0.18;
        const f = 0.72 + n;
        P.setXYZ(i, _v.x * f, _v.y * f * (_v.y < 0 ? 0.55 : 1), _v.z * f);
      }
      g.computeVertexNormals();
      return g;
    }
    function addRock(x, z, size, seed) {
      const c = tint(0xffffff, 0.72 + rand() * 0.25, 0.1);
      putE(WB, `stone@${Zone(x, z)}`, rockGeo(seed), x, size * 0.28, z, 0, rand() * 6.28, 0, size, size * (0.8 + rand() * 0.5), size * (0.8 + rand() * 0.4), c);
      if (size > 0.9) colCircle(x, z, size * 0.8);
    }

    /* —— 树 —— */
    const LEAF = { green: 0x3f6128, deep: 0x2f4d20, olive: 0x7b7430, gold: 0xc79a2a, pine: 0x27432b, cypress: 0x23402a, willow: 0x6f8f3a };

    function scholarTree(x, z, h, R, leaf) {                       // 古槐：粗干 + 分枝 + 团状树冠
      const zone = Zone(x, z), ph = rand() * 6.28;

    }
    function cypressTree(x, z, h) {                                 // 侧柏：窄塔形
      const zone = Zone(x, z), ph = rand() * 6.28;
      trunk(WB, zone, x, z, h * 0.3, h * 0.015, h * 0.03);
      for (let i = 0; i < 4; i++) {
        const y = h * (0.22 + i * 0.2), r = h * (0.14 - i * 0.022);

      }

    function addTree(kind, x, z, h) {
      if (kind === 0) scholarTree(x, z, h, h * 0.37, rand() > 0.25 ? LEAF.green : LEAF.deep);
      else if (kind === 1) pineTree(x, z, h * 1.05);
      else if (kind === 2) cypressTree(x, z, h * 1.1);

    }
    // 标志性两棵（对应参考照片：右侧浓绿古槐、左侧微黄槐树），树池石圈
    scholarTree(16.5, 41.5, 15.2, 5.6, LEAF.green);
    scholarTree(-15.0, 43.0, 11.6, 4.3, LEAF.olive);
    [[16.5, 41.5], [-15.0, 43.0]].forEach(([x, z]) => {
      for (let k = 0; k < 10; k++) { const a = k / 10 * 6.283; WB.put('stone@' + Zone(x, z), boxGeo(1.1, 0.4, 0.6, 2, false), x + Math.sin(a) * 1.5, 0.2, z + Math.cos(a) * 1.5, a, 1, 1, 1, tint(0xffffff, 0.95, 0.1)); }
    });
    // 神道两侧：侧柏夹道 + 槐树列植
    for (let z = 52; z <= 106; z += 9) {
      if (Math.abs(z - 74) < 6) continue;
      [-1, 1].forEach((sd) => cypressTree(sd * 11.6, z + (rand() - 0.5) * 1.5, 7.5 + rand() * 1.6));
    }
    for (let z = 58; z <= 100; z += 14) [-1, 1].forEach((sd) => { const x = sd * (22 + rand() * 3), zz = z + (rand() - 0.5) * 4; if (!nearPaved(x, zz, 1)) addTree(0, x, zz, 9 + rand() * 4); });
    // 院内丛林：随机填充（避开铺地 / 池 / 亭 / 山门）
    for (let i = 0, placed = 0; i < 360 && placed < 62; i++) {
      const x = (rand() * 2 - 1) * (WALL.x - 4), z = WALL.zBack + 4 + rand() * (WALL.zFront - WALL.zBack - 8);
      if (nearPaved(x, z, 2.5) || Math.max(Math.abs(x), Math.abs(z)) < 50 && z < 44) continue;
      const k = rand(), kind = k < 0.4 ? 0 : k < 0.62 ? 1 : k < 0.82 ? 2 : 3;
      addTree(kind, x, z, 8 + rand() * 6); placed++;
    }
    // 墙外远景林（只作背景，不进碰撞）
    (function outerGrove() {
      const keep = COL_CIRCLES.length;
      for (let i = 0, placed = 0; i < 400 && placed < 46; i++) {
        const x = (rand() * 2 - 1) * 150, z = -140 + rand() * 300;
