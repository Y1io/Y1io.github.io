    })();

    /* —— 石头散点 —— */
    [[-20, 48, 1.2], [-22, 51, 0.8], [22, 47, 1.0], [-58, 30, 1.4], [60, 20, 1.3], [58, 80, 1.5], [-62, -30, 1.6], [47, -50, 1.4]].forEach(([x, z, s], i) => addRock(x, z, s, i * 3.1));

    /* —— 放生池：石岸 + 荷叶 + 荷花 + 芦苇 + 太湖石 —— */
    (function pond() {
      const zn = Zone(POND.x, POND.z), cs = tint(0xffffff, 1.0, 0.1);
      for (let k = 0; k < 40; k++) {                                // 岸石（压沿）
        const a = k / 40 * Math.PI * 2, rr = POND.r + 0.35;
        WB.put(`stone@${zn}`, boxGeo(1.7, 0.4, 0.95, 2, false), POND.x + Math.sin(a) * rr, 0.2, POND.z + Math.cos(a) * rr, a, 1, 1, 1, tint(0xffffff, 0.9 + rand() * 0.2));
        WB.put(`stone@${zn}`, boxGeo(1.6, 0.18, 0.9, 2, false), POND.x + Math.sin(a) * (rr + 0.8), 0.09, POND.z + Math.cos(a) * (rr + 0.8), a, 1, 1, 1, tint(0xffffff, 0.82 + rand() * 0.2));
      }
      const padG = new THREE.CircleGeometry(0.55, 9); padG.rotateX(-Math.PI / 2);
      for (let i = 0; i < 38; i++) {
        const a = rand() * 6.28, d = Math.sqrt(rand()) * (POND.r - 1.0);
        putE(WB, `flower@${zn}`, padG, POND.x + Math.cos(a) * d, 0.1 + rand() * 0.02, POND.z + Math.sin(a) * d, 0, rand() * 6, 0, 0.7 + rand() * 0.8, 1, 0.7 + rand() * 0.8, tint(0x3f7a3a, 0.7 + rand() * 0.5));
      }
      for (let i = 0; i < 9; i++) {
        const a = rand() * 6.28, d = Math.sqrt(rand()) * (POND.r - 2.0), x = POND.x + Math.cos(a) * d, z = POND.z + Math.sin(a) * d;
        putE(WB, `flower@${zn}`, new THREE.ConeGeometry(0.3, 0.42, 7), x, 0.34, z, Math.PI, 0, 0, 1, 1, 1, tint(0xf2a8c4, 0.9 + rand() * 0.2));
        putE(WB, `flower@${zn}`, new THREE.ConeGeometry(0.16, 0.3, 6), x, 0.3, z, Math.PI, 0.5, 0, 1, 1, 1, tint(0xffe9a8));
      }
      for (let i = 0; i < 46; i++) {                                // 岸边芦苇（随风摆）
        const a = rand() * 6.28, d = POND.r - 0.4 - rand() * 1.0, hh = 1.4 + rand() * 1.2, ph = rand() * 6;
        putE(WB, `grass@${zn}`, new THREE.ConeGeometry(0.09, hh, 4), POND.x + Math.cos(a) * d, hh / 2, POND.z + Math.sin(a) * d, (rand() - 0.5) * 0.2, 0, (rand() - 0.5) * 0.2, 1, 1, 1, tint(0x6f8a3d, 0.7 + rand() * 0.5), { sway: { y0: 0, h: hh, phase: ph } });
      }
      addRock(POND.x + 8.2, POND.z - 6.4, 1.7, 41); addRock(POND.x + 9.9, POND.z - 4.6, 1.2, 42); addRock(POND.x + 7.0, POND.z - 8.6, 1.0, 43);
      addRock(POND.x - 9.6, POND.z + 5.4, 1.4, 44);
      colCircle(POND.x, POND.z, POND.r + 1.3);
    })();
    const waterMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uNight: { value: 0 }, uFogD: { value: 0.0007 }, uFogC: { value: new THREE.Color(0x9dbbe0) }, uSun: { value: SUN_DIR.clone() } },
      vertexShader: `varying vec3 vW; void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vW = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
      fragmentShader: `
        varying vec3 vW; uniform float uTime, uNight, uFogD; uniform vec3 uFogC, uSun;
        void main(){
          vec3 V = normalize(cameraPosition - vW); vec2 p = vW.xz;
          float a = p.x*1.7+uTime*0.9, b = p.y*2.3-uTime*0.7, c = (p.x+p.y)*3.1+uTime*1.3;
          vec3 n = normalize(vec3(cos(a)*0.05+cos(c)*0.03, 1.0, cos(b)*0.05+cos(c)*0.03));
          float fres = pow(1.0 - max(dot(V,n),0.0), 3.0);
          vec3 deep = mix(vec3(0.05,0.16,0.15), vec3(0.01,0.03,0.05), uNight);
          vec3 sky  = mix(vec3(0.55,0.72,0.92), vec3(0.05,0.08,0.16), uNight);
          vec3 col = mix(deep, sky, 0.15 + fres*0.85);
          float spec = pow(max(dot(reflect(-uSun, n), V), 0.0), 90.0);
          col += vec3(1.0,0.95,0.8) * spec * (1.0-uNight) * 0.9;
          float d = length(vW - cameraPosition); float f = 1.0 - exp(-uFogD*uFogD*d*d);
          gl_FragColor = vec4(mix(col, uFogC, f), 1.0);
        }`
    });
    const waterMesh = new THREE.Mesh(new THREE.CircleGeometry(POND.r, 48).rotateX(-Math.PI / 2), waterMat);
    waterMesh.position.set(POND.x, 0.07, POND.z);

    /* —— 花圃（石沿 + 土 + 花球 + 低矮灌木） —— */
    function flowerbed(x, z, w, d) {
      const zn = Zone(x, z), cs = tint(0xffffff, 0.95, 0.08);
      [[0, d / 2, w + 0.5, 0.5], [0, -d / 2, w + 0.5, 0.5]].forEach(([ox, oz, ww, dd]) => WB.put(`stone@${zn}`, boxGeo(ww, 0.42, dd, 2, false), x + ox, 0.21, z + oz, 0, 1, 1, 1, cs));
      [-w / 2, w / 2].forEach((ox) => WB.put(`stone@${zn}`, boxGeo(0.5, 0.42, d, 2, false), x + ox, 0.21, z, 0, 1, 1, 1, cs));
      WB.put(`bark@${zn}`, boxGeo(w - 0.4, 0.4, d - 0.4, 2, false), x, 0.2, z, 0, 1, 1, 1, tint(0x3b2f26));
      for (let i = 0; i < 26; i++) puff(zn, x + (rand() - 0.5) * (w - 1), 0.5 + rand() * 0.2, z + (rand() - 0.5) * (d - 1), 0.34 + rand() * 0.24, 0x4c7a35, 0, 1, rand() * 6);
      const cols = [0xffffff, 0xfacc15, 0xd946ef, 0xdc2626, 0xff8a3d, 0x9b8cff], bl = new THREE.IcosahedronGeometry(0.17, 0);
      for (let i = 0; i < 90; i++) putE(WB, `flower@${zn}`, bl, x + (rand() - 0.5) * (w - 0.9), 0.62 + rand() * 0.28, z + (rand() - 0.5) * (d - 0.9), 0, 0, 0, 1, 1, 1, tint(cols[i % cols.length], 0.9 + rand() * 0.25));
      colBox(x - w / 2 - 0.3, z - d / 2 - 0.3, x + w / 2 + 0.3, z + d / 2 + 0.3);
    }
    flowerbed(-23, 37, 7, 5); flowerbed(23, 37, 7, 5);

    /* —— 草丛（一次性合批，随风摆；按画质抽稀 drawRange）—— */
    const tuftGeo = (function () {
      const P = [], N = [], U = [], Cc = [], I = [];
      for (let b = 0; b < 6; b++) {
        const a = b * 1.05 + rand() * 0.4, tx = Math.sin(a) * 0.1, tz = Math.cos(a) * 0.1, lean = 0.1 + rand() * 0.25;
        const hh = 0.55 + rand() * 0.5, w = 0.05, o = P.length / 3, cx = Math.cos(a), cz = -Math.sin(a);
        P.push(tx - cx * w, 0, tz - cz * w, tx + cx * w, 0, tz + cz * w, tx + Math.sin(a) * lean, hh, tz + Math.cos(a) * lean);
        for (let k = 0; k < 3; k++) { N.push(0, 1, 0); U.push(0, 0); }
        Cc.push(0.45, 0.5, 0.3, 0.45, 0.5, 0.3, 1.1, 1.2, 0.7);
        I.push(o, o + 1, o + 2);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2)); g.setAttribute('color', new THREE.Float32BufferAttribute(Cc, 3));
      g.setIndex(I);
      return g;
    })();
    (function scatterGrass() {
      const wild = [0xffffff, 0xfff0a0, 0xc9a8ff, 0xffb6c8], od = new THREE.OctahedronGeometry(0.07, 0);
      let placed = 0;
      for (let i = 0; i < 9000 && placed < 5200; i++) {
        const x = (rand() * 2 - 1) * (WALL.x - 1.5), z = WALL.zBack + 1.5 + rand() * (WALL.zFront - WALL.zBack - 3);
        if (nearPaved(x, z, 0.4)) continue;
        if (Math.abs(x) < 34 && z > -34 && z < 34) continue;                      // 月台范围
        const dens = vnoise(x * 0.07, z * 0.07);
        const edge = (Math.abs(x) < 10.5 && z > 30) || (Math.abs(z - 74) < 6.5);   // 路缘多一些
        if (dens < (edge ? 0.12 : 0.34) && rand() > 0.12) continue;
        const sy = 0.7 + rand() * 1.1, dry = vnoise(x * 0.11 + 7, z * 0.11) > 0.62;
        const col = dry ? tint(0xb0a050, 0.8 + rand() * 0.3) : tint(0x6a8f3a, 0.75 + rand() * 0.5);
        WB.put(`grass@${Zone(x, z)}`, tuftGeo, x, 0, z, rand() * 6.28, sy, sy, sy, col, { sway: { y0: 0, h: 0.9 * sy, phase: rand() * 6.28 } });
        placed++;
        if (rand() < 0.07) putE(WB, `flower@${Zone(x, z)}`, od, x, 0.28 + rand() * 0.2, z, 0, 0, 0, 1, 1.3, 1, tint(wild[(rand() * 4) | 0]));
      }
    })();

    /* ==========================================================================
       13. 装配：地面 · 合批网格 · 萤火虫 · 晨雾
       ========================================================================== */
    groundTex.repeat.set(38, 38);
    const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(900, 900).rotateX(-Math.PI / 2), groundMat);
    groundMesh.receiveShadow = true;
    groundMesh.matrixAutoUpdate = false;
    templeGroup.add(groundMesh);

    const grassMeshes = [];
    function bakeInto(group, B) {
      Object.keys(B.b).forEach((key) => {
        if (!B.b[key]) return;
        const name = key.split('@')[0];
        const noCast = name === 'grass' || name === 'flower' || name === 'pave' || name === 'dark';
        const mesh = B.mesh(key, MAT[name], { cast: !noCast, receive: true });
        if (!mesh) return;
        if (name === 'grass') { mesh.userData.full = mesh.geometry.index.count; grassMeshes.push(mesh); }
        group.add(mesh);
      });
    }
    bakeInto(templeGroup, ST);
    bakeInto(templeGroup, WB);
    templeGroup.add(waterMesh);

    // 栏杆 / 台阶侧带 / 山门等碰撞体补充登记
    [-1, 1].forEach((sd) => {
      colBox(sd * (PLAT.stairHalf + 0.0), PLAT.upperA, sd * (PLAT.stairHalf + 0.9), PLAT.upperA + 5.0);
      colBox(sd * (PLAT.stairHalf + 0.0), PLAT.lowerHalf, sd * (PLAT.stairHalf + 0.9), PLAT.lowerHalf + 5.4);
      [-1, 1].forEach((sz) => colBox(sd * 3.1, gate.z + sz * gate.half - 0.4, sd * gate.half, gate.z + sz * gate.half + 0.4));
      colCircle(sd * 6.2, 26.4, 1.0);                                           // 石狮
    });
    (function towerColliders() {                                               // 副阶檐柱 + 石狮座
      const Av = LAY.Av, w = faceW(Av);
      for (let j = 0; j < 8; j++) {
        const c = cornerXZ(j, Av); colCircle(c[0], c[1], 0.62);
        [-0.19, 0.19].forEach((u) => { const p = faceXYZ(j, Av, u * w, 0); colCircle(p[0], p[1], 0.62); });
      }
    })();

    // 萤火虫（夜间出没，池畔与庭院）
    const ffMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uNight: { value: 0 }, uScale: { value: 120 } },
      vertexShader: `
        attribute float aSeed; uniform float uTime, uNight, uScale; varying float vA;
        void main(){
          vec3 p = position;
          p.x += sin(uTime * 0.4 + aSeed * 20.0) * 2.0; p.y += sin(uTime * 0.6 + aSeed * 13.0) * 0.8; p.z += cos(uTime * 0.35 + aSeed * 17.0) * 2.0;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = clamp(uScale / max(-mv.z, 1.0), 1.5, 14.0);
          vA = uNight * (0.25 + 0.75 * pow(0.5 + 0.5 * sin(uTime * 1.7 + aSeed * 40.0), 3.0));
        }`,
      fragmentShader: `
        varying float vA;
        void main(){ float d = length(gl_PointCoord - 0.5); gl_FragColor = vec4(1.0, 0.86, 0.42, smoothstep(0.5, 0.0, d) * vA); }`
    });
    const fireflies = (function () {
      const n = 90, P = [], S = [];
      for (let i = 0; i < n; i++) {
        const nearPond = i < 40, a = rand() * 6.28, d = Math.sqrt(rand());
        P.push(nearPond ? POND.x + Math.cos(a) * d * 13 : (rand() * 2 - 1) * 60, 0.7 + rand() * 2.8, nearPond ? POND.z + Math.sin(a) * d * 13 : -50 + rand() * 150);
        S.push(rand());
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      g.setAttribute('aSeed', new THREE.Float32BufferAttribute(S, 1));
      const pts = new THREE.Points(g, ffMat);
      pts.frustumCulled = false; pts.visible = false;
      return pts;
    })();
    scene.add(fireflies);

    // 晨雾流云层（仅起雾模式才参与渲染）
    const mistMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uTime: { value: 0 }, uOpacity: { value: 0.0 }, uNightMix: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uTime, uOpacity, uNightMix;
        void main(){
          vec2 p = vUv * 2.0 - 1.0;
          float radial = smoothstep(1.0, 0.15, length(p));
          float n = 0.5 + 0.5 * sin(p.x * 3.5 + uTime * 0.25) * cos(p.y * 3.5 - uTime * 0.2);
          gl_FragColor = vec4(mix(vec3(0.92, 0.94, 0.97), vec3(0.10, 0.14, 0.22), uNightMix), radial * n * uOpacity);
        }`
    });
    const mistGroup = new THREE.Group();
    (function () {
      const g = new THREE.PlaneGeometry(64, 64).rotateX(-Math.PI / 2);
      for (let i = 0; i < 9; i++) {
        const mp = new THREE.Mesh(g, mistMat), a = (i / 9) * Math.PI * 2, r = 24 + (i % 3) * 18;
        mp.position.set(Math.cos(a) * r, 1.6 + (i % 3) * 2.4, Math.sin(a) * r);
        mp.matrixAutoUpdate = false; mp.updateMatrix(); mp.frustumCulled = false;
        mistGroup.add(mp);
      }
    })();
    mistGroup.visible = false;
    scene.add(mistGroup);

    repaintPlaquesWhenFontReady();

    /* ==========================================================================
       14. 第一人称漫步：地形高度 · 台阶 · 碰撞（与视觉几何同源）
       ========================================================================== */
    const keys = { w: false, a: false, s: false, d: false, shift: false };
    let isFPV = false, isPointerLocked = false;
    const fpvEuler = new THREE.Euler(0, 0, 0, 'YXZ');
    const playerVel = new THREE.Vector3();
    const EYE = 1.72, PR = 0.38;

    function insideOct(x, z, A) {
      for (let k = 0; k < 8; k++) if (x * Math.sin(k * PI4) + z * Math.cos(k * PI4) > A) return false;
      return true;
    }
    function groundY(x, z) {
      if (Math.abs(x) < PLAT.stairHalf) {                                     // 两段踏跺（斜面近似，视觉是踏步）
        const zb = PLAT.upperA, zf = PLAT.upperA + 5.0;
        if (z >= zb && z <= zf) return PLAT.lowerTop + (PLAT.upperTop - PLAT.lowerTop) * clamp((zf - z) / 5.0, 0, 1);
        const zb2 = PLAT.lowerHalf, zf2 = PLAT.lowerHalf + 5.4;
        if (z >= zb2 && z <= zf2) return PLAT.lowerTop * clamp((zf2 - z) / 5.4, 0, 1);
      }
      if (insideOct(x, z, PLAT.upperA)) return PLAT.upperTop + 0.03;
      if (Math.abs(x) <= PLAT.lowerHalf && Math.abs(z) <= PLAT.lowerHalf) return PLAT.lowerTop;
      return 0.0;
    }
    function blockedAt(x, z, curGround) {
      const gate_ = Math.abs(x) < 2.4 && z > WALL.zFront - 12;                // 山门通道可出院
      if (Math.abs(x) > WALL.x - 1.4 || z < WALL.zBack + 1.4 || (z > WALL.zFront - 1.4 && !gate_) || z > WALL.zFront + 22) return true;
      if (insideOct(x, z, 12.35)) return true;                                // 首层墙身 + 柱
      for (let i = 0; i < COL_CIRCLES.length; i++) {
        const c = COL_CIRCLES[i], dx = x - c.x, dz = z - c.z, r = c.r + PR;
        if (dx * dx + dz * dz < r * r) return true;
      }
      for (let i = 0; i < COL_BOXES.length; i++) {
        const b = COL_BOXES[i];
        if (x > b.x0 - PR && x < b.x1 + PR && z > b.z0 - PR && z < b.z1 + PR) return true;
      }
      return Math.abs(groundY(x, z) - curGround) > 0.62;                      // 台基边沿：上、下都不能硬跨
    }

    const fpvForward = new THREE.Vector3(), fpvRight = new THREE.Vector3(), fpvDir = new THREE.Vector3();
    function updateFPV(delta) {
      fpvForward.set(0, 0, -1).applyQuaternion(camera.quaternion); fpvForward.y = 0; fpvForward.normalize();
      fpvRight.set(1, 0, 0).applyQuaternion(camera.quaternion); fpvRight.y = 0; fpvRight.normalize();
      fpvDir.set(0, 0, 0);
      if (keys.w) fpvDir.add(fpvForward);
      if (keys.s) fpvDir.sub(fpvForward);
      if (keys.d) fpvDir.add(fpvRight);
      if (keys.a) fpvDir.sub(fpvRight);
      const speed = keys.shift ? 17 : 9;
      if (fpvDir.lengthSq() > 0) { fpvDir.normalize().multiplyScalar(speed); playerVel.lerp(fpvDir, Math.min(1, delta * 9)); }
      else playerVel.multiplyScalar(Math.max(0, 1 - delta * 10));
      const cx = camera.position.x, cz = camera.position.z, cg = groundY(cx, cz);
      const nx = cx + playerVel.x * delta, nz = cz + playerVel.z * delta;
      if (!blockedAt(nx, cz, cg)) camera.position.x = nx; else playerVel.x = 0;       // 分轴处理 → 贴墙滑行
      if (!blockedAt(camera.position.x, nz, cg)) camera.position.z = nz; else playerVel.z = 0;
      const bob = playerVel.lengthSq() > 1 ? Math.sin(performance.now() * 0.011) * 0.035 : 0;
      camera.position.y = lerp(camera.position.y, groundY(camera.position.x, camera.position.z) + EYE + bob, Math.min(1, delta * 12));
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
      if (k === 'shift') keys.shift = true;
      if (k === 'f' && !e.repeat) fpsBadge.classList.toggle('hide');
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
      if (k === 'shift') keys.shift = false;
    });
    window.addEventListener('blur', () => { keys.w = keys.a = keys.s = keys.d = keys.shift = false; });
    canvas.addEventListener('click', () => { if (isFPV && !isPointerLocked) canvas.requestPointerLock(); });
    document.addEventListener('pointerlockchange', () => { isPointerLocked = (document.pointerLockElement === canvas); });
    window.addEventListener('mousemove', (e) => {
      if (isFPV && isPointerLocked) {
        fpvEuler.setFromQuaternion(camera.quaternion);
        fpvEuler.y -= (e.movementX || 0) * 0.0022;
        fpvEuler.x = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, fpvEuler.x - (e.movementY || 0) * 0.0022));
        camera.quaternion.setFromEuler(fpvEuler);
      }
    });

    /* ==========================================================================
       15. 画质 / 动态分辨率 / 帧率面板
       ========================================================================== */
    const isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const QUALITY = {
      high: { cap: Math.min(deviceDPR, 2), shadow: 4096, grass: 1.0 },
      mid: { cap: Math.min(deviceDPR, 1.5), shadow: 2048, grass: 0.6 },
      low: { cap: 1.0, shadow: 1024, grass: 0.3 }
    };
    const QUALITY_LABEL = { auto: '自动', high: '高', mid: '中', low: '低' };
    let qualityMode = 'auto';
    const dyn = { dpr: Math.min(deviceDPR, isCoarse ? 1.5 : 1.75), ceil: Math.min(deviceDPR, isCoarse ? 1.5 : 1.75), floor: 0.6, acc: 0, n: 0, warm: 90, good: 0, trial: null };
    const fpsBadge = document.getElementById('fps-badge'), fpsVal = document.getElementById('fps-val'), fpsSub = document.getElementById('fps-sub');

    function setDpr(v) {
      v = Math.round(v * 100) / 100;
      if (Math.abs(v - renderer.getPixelRatio()) < 0.005) return;
      renderer.setPixelRatio(v);
      ffMat.uniforms.uScale.value = 120 * v;
    }
    function setShadowSize(n) {
      if (sunLight.shadow.mapSize.x === n) return;
      if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
      sunLight.shadow.mapSize.set(n, n);
      renderer.shadowMap.needsUpdate = true;
    }
    function setGrass(frac) {
      grassMeshes.forEach((m) => { m.geometry.setDrawRange(0, Math.floor(m.userData.full * frac / 3) * 3); });
    }
    function applyQuality(mode) {
      qualityMode = mode;
      document.getElementById('quality-label').textContent = '画质: ' + QUALITY_LABEL[mode];
      if (mode === 'auto') {
        setShadowSize(isCoarse ? 1024 : 2048); setGrass(isCoarse ? 0.55 : 0.85);
        dyn.warm = 60; dyn.acc = 0; dyn.n = 0; dyn.good = 0; dyn.trial = null; setDpr(dyn.dpr);
      } else {
        const q = QUALITY[mode];
        setShadowSize(q.shadow); setGrass(q.grass); setDpr(q.cap);
      }
    }
    // 自动模式：测 40 帧均值；<46fps 降分辨率；连续 3 次轻松达标才试探性升回，试探失败则把上限锁在原值（不来回抖动）
    function dynamicResolution(rawDt) {
      if (qualityMode !== 'auto' || document.hidden || rawDt > 0.25) return;
      if (dyn.warm > 0) { dyn.warm--; return; }
      dyn.acc += rawDt; dyn.n++;
      if (dyn.n < 40) return;
      const avg = dyn.acc / dyn.n; dyn.acc = 0; dyn.n = 0;
      if (avg > 0.0215 && dyn.dpr > dyn.floor + 0.01) {
        if (dyn.trial) { dyn.ceil = dyn.trial.from; dyn.dpr = dyn.trial.from; dyn.trial = null; }
        else dyn.dpr = Math.max(dyn.floor, dyn.dpr - (avg > 0.032 ? 0.3 : 0.15));
        dyn.good = 0; setDpr(dyn.dpr);
      } else if (avg < 0.0185) {
        dyn.trial = null;
        if (++dyn.good >= 3 && dyn.dpr < dyn.ceil - 0.01) {
          dyn.trial = { from: dyn.dpr }; dyn.dpr = Math.min(dyn.ceil, dyn.dpr + 0.15); dyn.good = 0; setDpr(dyn.dpr);
        }
      }
    }
    let fpsAcc = 0, fpsN = 0;
    function updateFpsBadge(rawDt) {
      fpsAcc += rawDt; fpsN++;
      if (fpsAcc < 0.5) return;
      if (!fpsBadge.classList.contains('hide')) {
        const r = renderer.info.render;
        fpsVal.textContent = Math.round(fpsN / fpsAcc) + ' FPS';
        fpsSub.textContent = `x${renderer.getPixelRatio().toFixed(2)} · ${r.calls}dc · ${(r.triangles / 1000).toFixed(0)}k△`;
      }
      fpsAcc = 0; fpsN = 0;
    }
    document.getElementById('btn-quality').addEventListener('click', () => {
      const order = ['auto', 'high', 'mid', 'low'];
      applyQuality(order[(order.indexOf(qualityMode) + 1) % order.length]);
    });

    /* ==========================================================================
       16. 界面：昼夜 / 起雾 / 视角 / 机位 / 声景
       ========================================================================== */
    const state = { targetNight: 0, curNight: 0, isFog: false, targetFog: 0.0007, curFog: 0.0007, mistOp: 0, dirty: true };
    const $ = (id) => document.getElementById(id);
    const btnDay = $('btn-day'), btnNight = $('btn-night'), btnFog = $('btn-fog'), fogLabel = $('fog-label');
    const btnOrbit = $('btn-orbit'), btnFPV = $('btn-fpv'), btnSound = $('btn-sound'), soundLabel = $('sound-label');
    const crosshair = $('crosshair'), fpvHint = $('fpv-hint');
    const presetButtons = ['cam-photo', 'cam-plaque', 'cam-corridor', 'cam-aerial'].map($);
    let camTargetPos = null, camTargetLook = null;

    function setActivePreset(b) { presetButtons.forEach((x) => x.classList.remove('active')); if (b) b.classList.add('active'); }
    function flyTo(pos, look, btn) { if (isFPV) btnOrbit.click(); setActivePreset(btn); camTargetPos = pos; camTargetLook = look; }

    btnDay.addEventListener('click', () => { state.targetNight = 0; btnDay.classList.add('active'); btnNight.classList.remove('active'); });
    btnNight.addEventListener('click', () => { state.targetNight = 1; btnNight.classList.add('active'); btnDay.classList.remove('active'); });
    btnFog.addEventListener('click', () => {
      state.isFog = !state.isFog;
      state.targetFog = state.isFog ? 0.0095 : 0.0007;
      btnFog.classList.toggle('active', state.isFog);
      fogLabel.textContent = state.isFog ? '起雾模式 (晨霭)' : '不起雾 (晴朗)';
    });
    btnOrbit.addEventListener('click', () => {
      isFPV = false; btnOrbit.classList.add('active'); btnFPV.classList.remove('active');
      orbitControls.enabled = true; crosshair.style.display = 'none'; fpvHint.classList.add('hidden');
      if (document.exitPointerLock) document.exitPointerLock();
      camera.position.y = Math.max(camera.position.y, 3);
      orbitControls.target.set(0, 24, 0);
    });
    btnFPV.addEventListener('click', () => {
      isFPV = true; btnFPV.classList.add('active'); btnOrbit.classList.remove('active');
      setActivePreset(null); camTargetPos = camTargetLook = null;
      orbitControls.enabled = false; crosshair.style.display = 'block'; fpvHint.classList.remove('hidden');
      camera.position.set(0, groundY(0, 84) + EYE, 84);
      camera.lookAt(0, 16, 0);
      fpvEuler.setFromQuaternion(camera.quaternion); playerVel.set(0, 0, 0);
    });
    $('cam-photo').addEventListener('click', (e) => flyTo(new THREE.Vector3(0, 9, 90), new THREE.Vector3(0, 31, 0), e.currentTarget));
    $('cam-plaque').addEventListener('click', (e) => flyTo(new THREE.Vector3(7, 29, 40), new THREE.Vector3(0, 33, 0), e.currentTarget));
    $('cam-corridor').addEventListener('click', (e) => flyTo(new THREE.Vector3(0, 6.6, 34), new THREE.Vector3(0, 12, 0), e.currentTarget));
    $('cam-aerial').addEventListener('click', (e) => flyTo(new THREE.Vector3(56, 60, 76), new THREE.Vector3(0, 28, 0), e.currentTarget));
    btnSound.addEventListener('click', () => {
      const playing = audioEngine.toggle();
      soundLabel.textContent = playing ? '铁马风铎: 鸣' : '铁马风铎: 寂';
      btnSound.classList.toggle('active', playing);
    });

    /* ==========================================================================
       17. 主循环（昼夜 / 雾只在变化时才写 uniform；阴影不再逐帧重绘）
       ========================================================================== */
    const clock = new THREE.Clock();
    const _fogC = new THREE.Color();
    function updateEnvironment(delta, t) {
      const nightMoving = Math.abs(state.curNight - state.targetNight) > 0.0005;
      const fogMoving = Math.abs(state.curFog - state.targetFog) > 0.00002;
      const mistTarget = state.isFog ? 0.45 : 0.0, mistMoving = Math.abs(state.mistOp - mistTarget) > 0.002;
      if (nightMoving) state.curNight = lerp(state.curNight, state.targetNight, 1 - Math.exp(-delta * 2.2)); else state.curNight = state.targetNight;
      if (fogMoving) state.curFog = lerp(state.curFog, state.targetFog, 1 - Math.exp(-delta * 2.5)); else state.curFog = state.targetFog;
      if (mistMoving) state.mistOp = lerp(state.mistOp, mistTarget, 1 - Math.exp(-delta * 3.0)); else state.mistOp = mistTarget;
      if (!(nightMoving || fogMoving || mistMoving || state.dirty)) return;
      state.dirty = false;
      const n = state.curNight;
      skyMat.uniforms.uNightMix.value = n;
      _fogC.copy(fogDayColor).lerp(fogNightColor, n);
      scene.fog.color.copy(_fogC); scene.fog.density = state.curFog;
      hillsMat.color.copy(hillsDay).lerp(hillsNight, n);
      waterMat.uniforms.uNight.value = n; waterMat.uniforms.uFogC.value.copy(_fogC); waterMat.uniforms.uFogD.value = state.curFog;
      ffMat.uniforms.uNight.value = n; fireflies.visible = n > 0.05;
      mistMat.uniforms.uNightMix.value = n; mistMat.uniforms.uOpacity.value = state.mistOp; mistGroup.visible = state.mistOp > 0.01;
      sunLight.intensity = lerp(2.35, 0.25, n);
      sunLight.color.setRGB(lerp(1.0, 0.45, n), lerp(0.96, 0.60, n), lerp(0.89, 0.92, n));
      hemiLight.intensity = lerp(0.74, 0.18, n);
      MAT.window.emissiveIntensity = lerp(0.0, 1.7, n);
      MAT.lantern.emissiveIntensity = lerp(0.0, 2.4, n);
      nightLights[0].intensity = lerp(0.0, 2.4, n); nightLights[1].intensity = lerp(0.0, 2.0, n);
      renderer.toneMappingExposure = lerp(1.08, 1.25, n);
    }

    function animate() {
      requestAnimationFrame(animate);
      const rawDt = clock.getDelta(), delta = Math.min(rawDt, 0.1), elapsed = clock.elapsedTime;
      updateEnvironment(delta, elapsed);
      skyMat.uniforms.uTime.value = elapsed; windUniform.value = elapsed;
      if (waterMesh.visible) waterMat.uniforms.uTime.value = elapsed;
      if (fireflies.visible) ffMat.uniforms.uTime.value = elapsed;
      if (mistGroup.visible) mistMat.uniforms.uTime.value = elapsed;

      if (!isFPV) {
        if (camTargetPos && camTargetLook) {
          const k = 1 - Math.exp(-delta * 3.2);
          camera.position.lerp(camTargetPos, k); orbitControls.target.lerp(camTargetLook, k);
          if (camera.position.distanceTo(camTargetPos) < 0.25) { camTargetPos = null; camTargetLook = null; }
        }
        orbitControls.update();
        if (camera.position.y < 1.2) camera.position.y = 1.2;
      } else updateFPV(delta);

      renderer.render(scene, camera);
      dynamicResolution(rawDt); updateFpsBadge(rawDt);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    document.addEventListener('visibilitychange', () => { dyn.warm = 60; dyn.acc = 0; dyn.n = 0; });

    /* —— 启动 —— */
    renderer.shadowMap.needsUpdate = true;                 // 静态阴影：烘一次
    applyQuality('auto');
    ffMat.uniforms.uScale.value = 120 * renderer.getPixelRatio();
    renderer.render(scene, camera);                        // 预热：编译着色器 + 生成阴影
    animate();
    const loaderEl = document.getElementById('loader');
    if (loaderEl) setTimeout(() => loaderEl.classList.add('done'), 350);
    }
    // 先让加载画面渲染出来，再同步构建场景（构建约需数百毫秒）
    function startBoot() { requestAnimationFrame(() => setTimeout(boot, 30)); }
    if (document.readyState === "complete") startBoot(); else window.addEventListener("load", startBoot);
  </script>
</body>
</html>
